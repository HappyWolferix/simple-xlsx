/* ---------- tabs ---------- */
function renderTabs(){
  const t=$("tabs");t.innerHTML="";
  wb.sheets.forEach((s,i)=>{
    const d=document.createElement("div");d.className="tab"+(i===wb.active?" on":"");d.textContent=s.name;
    d.onmousedown=e=>{if(dvPicking())e.preventDefault();}; // keep focus in the field we are picking into
    d.onclick=()=>{
      const t=refTarget(),picking=!!t&&t.mode==="replace",pickEl=t&&t.el;
      wb.active=i;
      if(!picking){sel={r:0,c:0};selEnd=null;}
      buildGrid();renderTabs();
      if(picking){dvKeep=true;pickEl.focus();dvKeep=false;paintRefs();}
    };
    d.ondblclick=()=>{const n=prompt("Sheet name",s.name);if(n&&!sheetByName(n)){s.name=n;renderTabs();paintAll();save();}};
    d.oncontextmenu=e=>{e.preventDefault();if(wb.sheets.length>1&&confirm("Delete sheet "+s.name+"?")){wb.sheets.splice(i,1);wb.active=0;buildGrid();renderTabs();save();}};
    t.appendChild(d);
  });
  const add=document.createElement("button");add.textContent="+";
  add.onclick=()=>{let i=wb.sheets.length+1,n;do{n="Sheet"+i++}while(sheetByName(n));wb.sheets.push(newSheet(n));wb.active=wb.sheets.length-1;buildGrid();renderTabs();save();};
  t.appendChild(add);
  const st=document.createElement("span");st.id="status";st.textContent="dblclick tab: rename · right-click: delete";
  const vr=document.createElement("span");vr.className="ver";
  vr.textContent="v"+APP_VERSION;vr.title="Simple xlsx version "+APP_VERSION;
  st.appendChild(vr);
  t.appendChild(st);
}

/* ---------- XLSX export ----------
   A .xlsx is a ZIP of XML parts. We only ever STORE entries (no deflate), which keeps
   the writer to a CRC32 plus the three record types below — no compression library.
   This is a one-way trip: we translate as much as the format can carry and drop the rest. */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],dir=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.data==="string"?enc.encode(f.data):f.data;
    const crc=crc32(data);
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
    parts.push(new Uint8Array(local),name,data);
    dir.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),
      ...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...Array.from(name)]);
    off+=local.length+name.length+data.length;
  }
  const cd=[].concat(...dir),end=[...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(files.length),...u16(files.length),...u32(cd.length),...u32(off),...u16(0)];
  const blobParts=[...parts,new Uint8Array(cd),new Uint8Array(end)];
  return new Blob(blobParts,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xesc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// Excel wants a sheet name in quotes once it contains anything but word characters
const qSheet=n=>/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)?n:"'"+n.replace(/'/g,"''")+"'";

/* --- formula translation. The dialect is already Excel-shaped (= <> <= >= + - * / : ,)
   so only three things need fixing: VLOOKUP's missing match flag, sheet-name quoting,
   and the bare #REF sentinel. */
function xlFormula(src){
  let s=src.slice(1);
  s=s.replace(/([A-Za-z_][A-Za-z0-9_ ]*)!(\$?[A-Za-z]+\$?\d+)/g,(m,shn,ref)=>qSheet(shn.trim())+"!"+ref);
  s=s.replace(/#REF(?!!)/g,"#REF!");
  return vlookupExact(s);
}
// our VLOOKUP is always an exact match; Excel's defaults to approximate, so pin it to FALSE
function vlookupExact(s){
  let out="",i=0;
  while(i<s.length){
    const m=/VLOOKUP\s*\(/i.exec(s.slice(i));
    if(!m){out+=s.slice(i);break;}
    const start=i+m.index,open=start+m[0].length;
    let depth=1,j=open,commas=0,inStr=false;
    for(;j<s.length&&depth;j++){
      const ch=s[j];
      if(ch==='"'){inStr=!inStr;continue;}
      if(inStr)continue;
      if(ch==="(")depth++;
      else if(ch===")")depth--;
      else if(ch===","&&depth===1)commas++;
    }
    const close=j-1;                       // index of the matching ")"
    if(depth){out+=s.slice(i);break;}      // unbalanced — leave it alone
    const inner=s.slice(open,close);
    out+=s.slice(i,open)+vlookupExact(inner)+(commas===2?",FALSE":"")+")";
    i=close+1;
  }
  return out;
}

/* --- style tables. Excel indexes fonts/fills/borders/number-formats and each cell
   points at an xf that combines them, so everything gets deduped through one key. */
function xlStyles(){
  const fonts=['<font><sz val="11"/><name val="Calibri"/></font>'];
  // indices 0 and 1 are reserved by the format and must be exactly these two
  const fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'];
  const borders=['<border><left/><right/><top/><bottom/><diagonal/></border>'];
  const numFmts=[],xfs=['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
  const fontI=new Map(),fillI=new Map(),bordI=new Map(),numI=new Map(),xfI=new Map();
  const hex=c=>"FF"+String(c||"").replace("#","").toUpperCase().padStart(6,"0").slice(-6);
  const S={
    font(c,bold){if(!c&&!bold)return 0;
      const key=(c||"")+"|"+(bold?1:0);
      if(fontI.has(key))return fontI.get(key);
      fonts.push("<font>"+(bold?"<b/>":"")+'<sz val="11"/><name val="Calibri"/>'+
        (c?'<color rgb="'+hex(c)+'"/>':"")+"</font>");
      fontI.set(key,fonts.length-1);return fonts.length-1;},
    fill(c){if(!c)return 0;if(fillI.has(c))return fillI.get(c);
      fills.push('<fill><patternFill patternType="solid"><fgColor rgb="'+hex(c)+'"/><bgColor indexed="64"/></patternFill></fill>');
      fillI.set(c,fills.length-1);return fills.length-1;},
    border(b){b|=0;if(!b)return 0;if(bordI.has(b))return bordI.get(b);
      const tag=(nm,on)=>on?"<"+nm+' style="thin"><color rgb="FF000000"/></'+nm+">":"<"+nm+"/>";
      borders.push("<border>"+tag("left",b&BD_LEFT)+tag("right",b&BD_RIGHT)+
        tag("top",b&BD_TOP)+tag("bottom",b&BD_BOTTOM)+"<diagonal/></border>");
      bordI.set(b,borders.length-1);return borders.length-1;},
    num(d){if(d==null)return 0;if(numI.has(d))return numI.get(d);
      const id=164+numI.size;
      numFmts.push('<numFmt numFmtId="'+id+'" formatCode="'+(d>0?"0."+"0".repeat(d):"0")+'"/>');
      numI.set(d,id);return id;},
    xf(f){
      if(!f)return 0;
      const nf=S.num(f.dec!=null?f.dec:null),fo=S.font(f.color,f.bold),fi=S.fill(f.bg),bo=S.border(f.b);
      if(!nf&&!fo&&!fi&&!bo)return 0;
      const key=nf+"|"+fo+"|"+fi+"|"+bo;
      if(xfI.has(key))return xfI.get(key);
      xfs.push('<xf numFmtId="'+nf+'" fontId="'+fo+'" fillId="'+fi+'" borderId="'+bo+'" xfId="0"'+
        (nf?' applyNumberFormat="1"':"")+(fo?' applyFont="1"':"")+
        (fi?' applyFill="1"':"")+(bo?' applyBorder="1"':"")+"/>");
      xfI.set(key,xfs.length-1);return xfs.length-1;},
    dxfs:[],
    // a conditional format points at a "differential" style: only what the rule overrides
    dxf(f){
      const body="<dxf>"+((f.color||f.bold)?"<font>"+(f.bold?"<b/>":"")+
          (f.color?'<color rgb="'+hex(f.color)+'"/>':"")+"</font>":"")+
        (f.bg?'<fill><patternFill><bgColor rgb="'+hex(f.bg)+'"/></patternFill></fill>':"")+"</dxf>";
      let i=S.dxfs.indexOf(body);
      if(i<0){S.dxfs.push(body);i=S.dxfs.length-1;}
      return i;},
    xml(){
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
        '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
        (numFmts.length?'<numFmts count="'+numFmts.length+'">'+numFmts.join("")+"</numFmts>":"")+
        '<fonts count="'+fonts.length+'">'+fonts.join("")+"</fonts>"+
        '<fills count="'+fills.length+'">'+fills.join("")+"</fills>"+
        '<borders count="'+borders.length+'">'+borders.join("")+"</borders>"+
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
        '<cellXfs count="'+xfs.length+'">'+xfs.join("")+"</cellXfs>"+
        '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
        (S.dxfs.length?'<dxfs count="'+S.dxfs.length+'">'+S.dxfs.join("")+"</dxfs>":'<dxfs count="0"/>')+
        "</styleSheet>";}
  };
  return S;
}

/* --- conditional formatting. Our rules name an exemplar cell to copy colours from;
   xlsx can only carry the resolved colours, so the live link to that cell is lost. */
function xlCfFormula(sh,rule,b){
  const top=addr(b.c1,b.r1);
  const t=(rule.test||"").trim();
  let ref;
  if(!t)ref=top;                                        // the painted cell itself
  else{
    const m=t.match(/^(?:([A-Za-z_][A-Za-z0-9_ ]*)!)?\$?([A-Za-z]+)\$?(\d+)?$/);
    if(!m)return null;
    const pre=m[1]?qSheet(m[1].trim())+"!":"";
    ref=m[3]?pre+"$"+m[2].toUpperCase()+"$"+m[3]         // a fixed cell
           :pre+"$"+m[2].toUpperCase()+(b.r1+1);         // that column, same row
  }
  const lit=v=>{
    const s=String(v==null?"":v);
    return isNum(s)&&s.trim()!==""?s.trim():'"'+s.replace(/"/g,'""')+'"';
  };
  switch(rule.op){
    case "between":{
      const lo=rule.lo===">="?">=":">",hi=rule.hi||"<=";
      // stored as the test applied to the cell: ">" means "low < value"
      return "AND("+ref+lo+lit(rule.v1)+","+ref+hi+lit(rule.v2)+")";
    }
    case "in":{
      const rb=cfBounds(sh,rule.v1||"");
      if(!rb)return null;
      const rng=(rb.sh!==sh?qSheet(rb.sh.name)+"!":"")+"$"+colName(rb.c1)+"$"+(rb.r1+1)+
                ":$"+colName(rb.c2)+"$"+(rb.r2+1);
      return "COUNTIF("+rng+","+ref+")>0";
    }
    case "!=":return ref+"<>"+lit(rule.v1);
    case "==":return ref+"="+lit(rule.v1);
    default:return ref+rule.op+lit(rule.v1);
  }
}

function xlSheetXml(sh,S,dvNames){
  const rows=[];
  // one pass to find which rows hold anything, so empty rows cost nothing
  const byRow=new Map();
  for(const a in sh.cells){
    const m=/^([A-Z]+)(\d+)$/.exec(a);
    if(!m)continue;
    const r=+m[2]-1,c=colIdx(m[1]);
    if(c>=COLS||r>=ROWS)continue;
    if(!byRow.has(r))byRow.set(r,[]);
    byRow.get(r).push([c,a]);
  }
  for(const r of[...byRow.keys()].sort((x,y)=>x-y)){
    const cells=byRow.get(r).sort((x,y)=>x[0]-y[0]),out=[];
    for(const[c,a]of cells){
      const cl=sh.cells[a],f=cl.f||null;
      const s=S.xf(f),sa=s?' s="'+s+'"':"";
      const ref=colName(c)+(r+1);
      const raw=cl.v==null?"":String(cl.v);
      if(raw===""){if(s)out.push('<c r="'+ref+'"'+sa+"/>");continue;}
      if(raw[0]==="="){
        let v;try{v=getValue(sh,a,new Set());}catch(e){v="";}
        const bad=v&&typeof v==="object";
        const numeric=typeof v==="number"&&isFinite(v);
        // ship the cached value too, so the file shows results before a recalc
        out.push('<c r="'+ref+'"'+sa+(numeric?"":' t="str"')+"><f>"+xesc(xlFormula(raw))+"</f>"+
          (bad?"":"<v>"+xesc(numeric?v:String(v))+"</v>")+"</c>");
        continue;
      }
      const t=f&&f.type;
      if(t!=="text"&&t!=="date"&&isNum(raw)&&raw.trim()!=="")
        out.push('<c r="'+ref+'"'+sa+"><v>"+parseFloat(raw.trim())+"</v></c>");
      else
        out.push('<c r="'+ref+'"'+sa+' t="inlineStr"><is><t xml:space="preserve">'+xesc(raw)+"</t></is></c>");
    }
    if(!out.length)continue;
    const h=sh.rowH[r];
    rows.push('<row r="'+(r+1)+'"'+(h?' ht="'+(h*0.75).toFixed(2)+'" customHeight="1"':"")+">"+out.join("")+"</row>");
  }
  const cols=[];
  for(let c=0;c<COLS;c++)if(sh.colW[c])
    cols.push('<col min="'+(c+1)+'" max="'+(c+1)+'" width="'+((sh.colW[c]-5)/7).toFixed(2)+'" customWidth="1"/>');

  // dropdowns: xlsx will not take a cross-sheet range inline, so each one becomes a defined name
  const dv=[];
  for(const[src,addrs]of dvGroups(sh)){
    const b=cfBounds(sh,src);
    if(!b)continue;
    const nm="_dv"+(dvNames.length+1);
    dvNames.push({name:nm,ref:qSheet(b.sh.name)+"!$"+colName(b.c1)+"$"+(b.r1+1)+":$"+colName(b.c2)+"$"+(b.r2+1)});
    dv.push('<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="'+
      addrs.join(" ")+'"><formula1>'+nm+"</formula1></dataValidation>");
  }
  const cf=[];
  let prio=1;
  for(const rule of sh.rules||[]){
    const b=cfBounds(sh,rule.range||"");
    if(!b||b.sh!==sh)continue;
    const f=cfFmt(sh,rule.fmt||"");
    if(!f||(!f.color&&!f.bg))continue;
    const fx=xlCfFormula(sh,rule,b);
    if(!fx)continue;
    cf.push('<conditionalFormatting sqref="'+colName(b.c1)+(b.r1+1)+":"+colName(b.c2)+(b.r2+1)+
      '"><cfRule type="expression" dxfId="'+S.dxf(f)+'" priority="'+(prio++)+'"><formula>'+
      xesc(fx)+"</formula></cfRule></conditionalFormatting>");
  }
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetFormatPr defaultRowHeight="16.5"/>'+
    (cols.length?"<cols>"+cols.join("")+"</cols>":"")+
    "<sheetData>"+rows.join("")+"</sheetData>"+
    cf.join("")+
    (dv.length?'<dataValidations count="'+dv.length+'">'+dv.join("")+"</dataValidations>":"")+
    "</worksheet>";
}

function exportXlsx(){
  const S=xlStyles(),dvNames=[],sheetXml=[];
  for(const sh of wb.sheets)sheetXml.push(xlSheetXml(sh,S,dvNames));
  const rels=wb.sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+
    '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("");
  const sid=wb.sheets.length+1;
  const files=[
    {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      wb.sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+
        '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      "</Types>"},
    {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      "</Relationships>"},
    {name:"xl/workbook.xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'+
      ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
      wb.sheets.map((s,i)=>'<sheet name="'+xesc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+
      "</sheets>"+(dvNames.length?"<definedNames>"+dvNames.map(d=>'<definedName name="'+d.name+'">'+
        xesc(d.ref)+"</definedName>").join("")+"</definedNames>":"")+"</workbook>"},
    {name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+
      '<Relationship Id="rId'+sid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
      "</Relationships>"},
  ];
  wb.sheets.forEach((s,i)=>files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:sheetXml[i]}));
  files.push({name:"xl/styles.xml",data:S.xml()});   // last: dxfs are only known once sheets are built
  const a=document.createElement("a");
  a.href=URL.createObjectURL(zipStore(files));
  a.download=safeName()+".xlsx";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

/* ---------- XLSX import ----------
   One-way in: we keep what this app can represent (values, formulas we can evaluate,
   colours, borders, decimals, dropdowns, sizes) and silently drop the rest —
   conditional formats, merges, charts, fonts, and every function we cannot compute. */
const XL_MAXCOL=200,XL_MAXROW=5000;      // guard rails: xlsx sheets can claim 16384 x 1048576
function zipEntries(u8){
  let e=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-22-65536;i--)
    if(u8[i]===80&&u8[i+1]===75&&u8[i+2]===5&&u8[i+3]===6){e=i;break;}
  if(e<0)throw"not a .xlsx file (no zip directory)";
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const n=dv.getUint16(e+10,true);
  let p=dv.getUint32(e+16,true);
  const out=new Map(),dec=new TextDecoder();
  for(let i=0;i<n&&p+46<=u8.length;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nlen));
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    out.set(name,{method,data:u8.subarray(start,start+csize)});
    p+=46+nlen+elen+clen;
  }
  return out;
}
// real .xlsx files are deflated; the browser's own inflater saves us a decompressor
async function zipText(ent){
  if(!ent)return null;
  if(ent.method===0)return new TextDecoder().decode(ent.data);
  if(ent.method!==8)throw"unsupported zip compression";
  if(typeof DecompressionStream!=="function")throw"this browser cannot read compressed .xlsx";
  const st=new Blob([ent.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new TextDecoder().decode(new Uint8Array(await new Response(st).arrayBuffer()));
}
const xparse=t=>new DOMParser().parseFromString(t,"application/xml");
const els=(d,n)=>[...d.getElementsByTagNameNS("*",n)];   // prefix-agnostic
const el1=(d,n)=>d.getElementsByTagNameNS("*",n)[0]||null;

/* --- colours. Excel usually stores a theme index plus a tint rather than an rgb. */
function xlTheme(txt){
  if(!txt)return[];
  try{
    const sc=el1(xparse(txt),"clrScheme");
    if(!sc)return[];
    const list=[...sc.children].map(n=>{
      const s=el1(n,"srgbClr");
      if(s)return"#"+s.getAttribute("val");
      const y=el1(n,"sysClr");
      return y?"#"+(y.getAttribute("lastClr")||"000000"):"#000000";
    });
    // the scheme lists dk1,lt1,dk2,lt2,... but style theme indices swap each pair
    return list.length>=4?[list[1],list[0],list[3],list[2],...list.slice(4)]:list;
  }catch(e){return[];}
}
function xlTint(hex,t){
  if(!t)return hex;
  const ch=i=>parseInt(hex.slice(i,i+2),16);
  const ap=v=>t<0?v*(1+t):v*(1-t)+255*t;
  const h=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0");
  return"#"+h(ap(ch(1)))+h(ap(ch(3)))+h(ap(ch(5)));
}
function xlColor(el,theme){
  if(!el)return"";
  const rgb=el.getAttribute("rgb");
  if(rgb)return"#"+rgb.slice(-6).toLowerCase();
  const th=el.getAttribute("theme");
  if(th!=null&&theme[+th])return xlTint(theme[+th],parseFloat(el.getAttribute("tint")||"0")).toLowerCase();
  return"";
}
// our model keeps a decimal count, xlsx keeps a format code — recover the count where we can
const XL_DEC={1:0,2:2,3:0,4:2,9:0,10:2,37:0,38:0,39:2,40:2,43:2,44:2};
function xlDecimals(id,custom){
  if(id==null)return null;
  const code=custom.get(String(id));
  if(code!=null){
    const c=code.replace(/\[[^\]]*\]/g,"").replace(/"[^"]*"/g,"");
    if(/[ymdhs]/i.test(c))return null;                 // a date format, not a decimal count
    const m=/\.(0+)/.exec(c);
    return m?m[1].length:(/[0#]/.test(c)?0:null);
  }
  return XL_DEC[+id]!=null?XL_DEC[+id]:null;
}
function xlReadStyles(txt,themeTxt){
  if(!txt)return[];
  const d=xparse(txt),theme=xlTheme(themeTxt),custom=new Map();
  for(const f of els(d,"numFmt"))custom.set(f.getAttribute("numFmtId"),f.getAttribute("formatCode")||"");
  const kids=n=>{const e=el1(d,n);return e?[...e.children]:[];};
  // <b/> with no val, or val="1"/"true", is on; val="0" is an explicit off
  const fonts=kids("fonts").map(f=>{
    const b=el1(f,"b"),bv=b&&b.getAttribute("val");
    return{color:xlColor(el1(f,"color"),theme),bold:!!b&&bv!=="0"&&bv!=="false"};
  });
  const fills=kids("fills").map(f=>{
    const p=el1(f,"patternFill");
    if(!p||(p.getAttribute("patternType")||"none")==="none")return"";
    return xlColor(el1(p,"fgColor"),theme);
  });
  const borders=kids("borders").map(b=>{
    const on=nm=>{const e=el1(b,nm),st=e&&e.getAttribute("style");return!!st&&st!=="none";};
    return(on("top")?BD_TOP:0)|(on("right")?BD_RIGHT:0)|(on("bottom")?BD_BOTTOM:0)|(on("left")?BD_LEFT:0);
  });
  const xfs=el1(d,"cellXfs");
  return(xfs?[...xfs.children]:[]).map(xf=>{
    const f={},g=n=>+(xf.getAttribute(n)||0),ap=n=>xf.getAttribute(n)==="1";
    const fo=fonts[g("fontId")];
    if(fo&&fo.color)f.color=fo.color;
    if(fo&&fo.bold)f.bold=true;
    const bg=fills[g("fillId")];if(bg)f.bg=bg;
    const b=borders[g("borderId")];if(b)f.b=b;
    // applyNumberFormat is advisory; a non-zero id on its own is enough
    const nf=xf.getAttribute("numFmtId");
    if(nf&&(+nf||ap("applyNumberFormat"))){const dc=xlDecimals(nf,custom);if(dc!=null)f.dec=dc;}
    return f;
  });
}

/* --- formulas. A formula comes across only if every function in it is one we
   implement; anything else falls back to the cached value Excel stored with it. */
const XL_FNS=new Set(Object.keys(FNS));
function xlImportFormula(src){
  let s=(src||"").trim();
  if(!s||s[0]==="=")s=s.replace(/^=/,"");
  if(!s)return null;
  if(/[{}\[\]]/.test(s))return null;                      // array constants / table refs we cannot parse
  if(/_xlfn\./i.test(s))return null;
  let bad=false;
  s=s.replace(/'([^']*)'!/g,(m,n)=>{                     // 'My Data'!A1 -> My Data!A1
    if(!/^[A-Za-z_][A-Za-z0-9_ ]*$/.test(n)){bad=true;return m;}
    return n+"!";
  });
  if(bad)return null;
  for(const m of s.matchAll(/([A-Za-z_][A-Za-z0-9_.]*)\s*\(/g))
    if(!XL_FNS.has(m[1].toUpperCase()))return null;
  return"="+s;
}

/* --- one worksheet */
function xlReadSheet(txt,name,styles,sst,names,stats){
  const d=xparse(txt),sh=newSheet(name);
  for(const c of els(d,"col")){
    const w=parseFloat(c.getAttribute("width")||"0");
    if(!w||c.getAttribute("customWidth")!=="1")continue;
    const px=Math.round(w*7+5);
    for(let i=+c.getAttribute("min");i<=Math.min(+c.getAttribute("max"),XL_MAXCOL);i++)sh.colW[i-1]=px;
  }
  for(const row of els(d,"row")){
    const r=+row.getAttribute("r")-1;
    if(!(r>=0))continue;
    if(r>=XL_MAXROW){stats.clipped=true;continue;}
    const ht=parseFloat(row.getAttribute("ht")||"0");
    if(ht&&row.getAttribute("customHeight")==="1")sh.rowH[r]=Math.round(ht/0.75);
    for(const c of els(row,"c")){
      const ref=c.getAttribute("r")||"";
      const m=/^([A-Z]+)(\d+)$/.exec(ref);
      if(!m)continue;
      const ci=colIdx(m[1]);
      if(ci>=XL_MAXCOL){stats.clipped=true;continue;}
      const t=c.getAttribute("t")||"n";
      const fEl=el1(c,"f"),vEl=el1(c,"v"),isEl=el1(c,"is");
      let raw="",text=false;
      if(t==="s"){const i=+(vEl?vEl.textContent:-1);raw=sst[i]!=null?sst[i]:"";text=true;}
      else if(t==="inlineStr"){raw=isEl?els(isEl,"t").map(x=>x.textContent).join(""):"";text=true;}
      else if(t==="str"){raw=vEl?vEl.textContent:"";text=true;}
      else if(t==="b"){raw=(vEl&&vEl.textContent==="1")?"TRUE":"FALSE";}
      else if(t==="e"){raw=vEl?vEl.textContent:"#ERR";text=true;}
      else raw=vEl?vEl.textContent:"";
      let formula=null;
      if(fEl&&!fEl.getAttribute("t")){                    // shared/array formulas: value only
        formula=xlImportFormula(fEl.textContent);
        if(!formula&&fEl.textContent.trim())stats.dropped++;
      }else if(fEl)stats.dropped++;
      const st=styles[+(c.getAttribute("s")||0)];
      const f=st?{...st}:{};
      // a text cell holding digits must stay text, or our auto-typing would turn it into a number
      if(text&&!formula&&isNum(raw)&&raw.trim()!=="")f.type="text";
      if(formula==null&&raw==="" &&!Object.keys(f).length)continue;
      const cl={};
      if(formula)cl.v=formula;else if(raw!=="")cl.v=raw;
      if(Object.keys(f).length)cl.f=f;
      if(cl.v===undefined&&!cl.f)continue;
      sh.cells[colName(ci)+(r+1)]=cl;
      stats.maxC=Math.max(stats.maxC,ci);stats.maxR=Math.max(stats.maxR,r);
    }
  }
  // dropdowns: a list validation pointing at a range (a literal "a,b,c" list has no home here)
  for(const dvEl of els(d,"dataValidation")){
    if((dvEl.getAttribute("type")||"")!=="list")continue;
    const f1=el1(dvEl,"formula1");
    let src=(f1?f1.textContent:"").trim();
    if(!src||src[0]==='"'){stats.dropped++;continue;}
    if(names.has(src))src=names.get(src);
    src=src.replace(/\$/g,"").replace(/'([^']*)'!/g,"$1!");
    if(!/^(?:[^!]+!)?[A-Z]+\d+(?::[A-Z]+\d+)?$/.test(src)){stats.dropped++;continue;}
    for(const part of(dvEl.getAttribute("sqref")||"").split(/\s+/)){
      const rm=/^([A-Z]+)(\d+)(?::([A-Z]+)(\d+))?$/.exec(part);
      if(!rm)continue;
      const c1=colIdx(rm[1]),r1=+rm[2]-1,c2=rm[3]?colIdx(rm[3]):c1,r2=rm[4]?+rm[4]-1:r1;
      for(let r=r1;r<=Math.min(r2,XL_MAXROW-1);r++)for(let c=c1;c<=Math.min(c2,XL_MAXCOL-1);c++){
        const a=colName(c)+(r+1);
        (sh.cells[a]=sh.cells[a]||{}).f=Object.assign(sh.cells[a].f||{},{dv:src});
        stats.maxC=Math.max(stats.maxC,c);stats.maxR=Math.max(stats.maxR,r);
      }
    }
  }
  if(els(d,"conditionalFormatting").length)stats.cf=true;
  if(els(d,"mergeCell").length)stats.merged=true;
  return sh;
}

async function importXlsx(file){
  const zip=zipEntries(new Uint8Array(await file.arrayBuffer()));
  const get=n=>zipText(zip.get(n));
  const wbTxt=await get("xl/workbook.xml");
  if(!wbTxt)throw"not a .xlsx workbook";
  const relTxt=await get("xl/_rels/workbook.xml.rels");
  const rels=new Map();
  if(relTxt)for(const r of els(xparse(relTxt),"Relationship"))
    rels.set(r.getAttribute("Id"),r.getAttribute("Target").replace(/^\/?(xl\/)?/,""));
  const sstTxt=await get("xl/sharedStrings.xml");
  const sst=sstTxt?els(xparse(sstTxt),"si").map(si=>els(si,"t").map(t=>t.textContent).join("")):[];
  const styles=xlReadStyles(await get("xl/styles.xml"),await get("xl/theme/theme1.xml"));

  const wbDoc=xparse(wbTxt);
  const names=new Map();
  for(const n of els(wbDoc,"definedName"))names.set(n.getAttribute("name"),n.textContent.trim());
  const stats={dropped:0,maxC:0,maxR:0,cf:false,merged:false,clipped:false};
  const sheets=[];
  let i=0;
  for(const s of els(wbDoc,"sheet")){
    i++;
    const rid=s.getAttribute("r:id")||s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const path="xl/"+(rels.get(rid)||"worksheets/sheet"+i+".xml");
    const txt=await get(path);
    if(!txt)continue;
    sheets.push(xlReadSheet(txt,s.getAttribute("name")||"Sheet"+i,styles,sst,names,stats));
  }
  if(!sheets.length)throw"no readable sheets in this file";
  return{wb:{name:file.name.replace(/\.xlsx$/i,"")||"Simple xlsx",sheets,active:0},stats};
}

function xlSummary(st){
  const bits=[];
  if(st.dropped)bits.push(st.dropped+" formula"+(st.dropped===1?"":"s")+" replaced by their last value");
  if(st.cf)bits.push("conditional formatting dropped");
  if(st.merged)bits.push("merged cells dropped");
  if(st.clipped)bits.push("clipped to "+XL_MAXCOL+" columns / "+XL_MAXROW+" rows");
  return bits.length?"Imported, with changes:\n• "+bits.join("\n• "):"";
}
$("loadXlsx").onclick=()=>$("xlsxFile").click();
$("xlsxFile").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0];
  e.target.value="";                         // let the same file be picked again

/* ---------- persistence & export ---------- */
/* ---------- undo / redo ---------- */
// every mutation funnels through save(), so save() doubles as the history checkpoint
const undoStack=[],redoStack=[],UNDO_MAX=100;
let lastSnap=null,restoring=false;
function snapshot(json){return{json:json!=null?json:JSON.stringify(wb),cols:COLS,rows:ROWS,sel:{...sel},selEnd:selEnd?{...selEnd}:null};}
function restoreSnap(s){
  wb=JSON.parse(s.json);COLS=s.cols;ROWS=s.rows;
  sel={...s.sel};selEnd=s.selEnd?{...s.selEnd}:null;clampSel();
  clip=null;lastSnap=s;
  if(!wb.name)wb.name="Simple xlsx";
  $("appname").textContent=wb.name;applyName();
  restoring=true;
  buildGrid();renderTabs();save();
  restoring=false;
}
function undo(){if(!undoStack.length)return;redoStack.push(lastSnap);restoreSnap(undoStack.pop());}
function redo(){if(!redoStack.length)return;undoStack.push(lastSnap);restoreSnap(redoStack.pop());}
function save(){
  const json=JSON.stringify(wb);
  if(!restoring&&lastSnap&&json!==lastSnap.json){
    undoStack.push(lastSnap);
    if(undoStack.length>UNDO_MAX)undoStack.shift();
    redoStack.length=0;
    lastSnap=snapshot(json);
  }
  try{localStorage.setItem("gridfile",json);}catch(e){}
}
// grow the grid so the tallest used row is always reachable
function fitRows(){
  let maxR=0,maxC=0;
  for(const sh of wb.sheets)for(const a in sh.cells){
    const m=a.match(/^([A-Z]+)(\d+)$/);
    if(!m)continue;
    maxR=Math.max(maxR,+m[2]);maxC=Math.max(maxC,colIdx(m[1])+1);
  }
  while(ROWS<maxR+20)ROWS+=100;
  if(COLS<maxC)COLS=maxC;
}
function normalize(){
  if(!(wb.active>=0&&wb.active<wb.sheets.length))wb.active=0;
  for(const sh of wb.sheets){
    sh.colW=sh.colW||{};sh.rowH=sh.rowH||{};
    sh.rules=(sh.rules||[]).map(r=>{
      if(r.range)return r;                       // already the current shape
      const col=colName(r.col||0);               // old column-scoped rule
      return r.op==="in"
        ?{range:col+"1:"+col+ROWS,op:"in",v1:r.src||"",fmt:r.fmt||""}
        :{range:col+"1:"+col+ROWS,op:"==",v1:r.value!=null?r.value:"",fmt:r.fmt||""};
    });
  }
}
function load(){
  const emb=$("gfdata").textContent.trim();
  if(emb){try{const w=JSON.parse(emb);if(w&&w.sheets){wb=w;return;}}catch(e){}}
  try{const s=localStorage.getItem("gridfile");if(s){const w=JSON.parse(s);if(w&&w.sheets)wb=w;}}catch(e){}
}
// write the whole app back out as one HTML file with the workbook baked in
// the whole page with the current workbook baked in — what both saving routes write
function pageHtml(){
  const json=JSON.stringify(wb).replace(/</g,"\\u003c");
  let html=PRISTINE.replace(/(<script id="gfdata"[^>]*>)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
  // bake the name in too, so the saved file shows it before any script runs
  const esc=safeName().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return html.replace(/<title>[\s\S]*?<\/title>/,"<title>"+esc+"</title>")
             .replace(/(<span id="appname"[^>]*>)[\s\S]*?(<\/span>)/,(m,a,b)=>a+esc+b);
}
function downloadHtml(){
  const b=new Blob([pageHtml()],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=safeName()+".html";a.click();
}

};

/* ---------- save in place ---------- */
/* Ctrl+S overwrites the .html file itself, but only for a copy opened from disk:
   served over http the page is not a document the user owns, so there Ctrl+S keeps
   its old meaning and downloads a copy.

   A page may never silently write the file it was loaded from, so the first Ctrl+S
   opens a picker once — point it at this same file and confirm the overwrite. The
   handle is kept, and remembered in IndexedDB across reloads, so every later Ctrl+S
   writes straight through with no dialog. Chromium only; elsewhere the API is absent
   and we fall back to the download. */
const canSaveInPlace=()=>location.protocol==="file:"&&typeof window.showSaveFilePicker==="function";
let fileHandle=null;
// Remembering the handle is a convenience, never a precondition: on a file: origin
// indexedDB.open can hang without ever firing success, error or blocked, so every use
// races a timeout and any failure simply means "nothing stored, ask for the file".
function idbHandle(fn,ms){
  return Promise.race([
    new Promise((res,rej)=>{
      if(!self.indexedDB)return rej(new Error("no indexedDB"));
      const rq=indexedDB.open("gridfile",1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore("h");
      rq.onerror=()=>rej(rq.error);
      rq.onblocked=()=>rej(new Error("blocked"));
      rq.onsuccess=()=>{
        try{
          const tx=rq.result.transaction("h","readwrite"),q=fn(tx.objectStore("h"));
          q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
        }catch(err){rej(err);}
      };
    }),
    new Promise((res,rej)=>setTimeout(()=>rej(new Error("timeout")),ms||500))
  ]);
}
function savetip(msg){
  const t=$("savetip");
  t.textContent=msg;t.style.display="block";
  clearTimeout(savetip.t);savetip.t=setTimeout(()=>{t.style.display="none";},1800);
}
async function saveInPlace(){
  let h=fileHandle;
  if(!h)try{h=await idbHandle(st=>st.get("file"));}catch(err){}
  if(h){
    // a handle out of IndexedDB starts the session unauthorised; Ctrl+S is the gesture
    // that lets us ask for it back, and a refusal just means picking the file again
    const opt={mode:"readwrite"};
    let p=await h.queryPermission(opt);
    if(p!=="granted")p=await h.requestPermission(opt);
    if(p!=="granted")h=null;
  }
  if(!h)h=await window.showSaveFilePicker({suggestedName:safeName()+".html",
    types:[{description:"HTML page",accept:{"text/html":[".html"]}}]});
  const w=await h.createWritable();
  await w.write(pageHtml());
  await w.close();
  fileHandle=h;
  idbHandle(st=>st.put(h,"file")).catch(()=>{});   // best effort, never awaited
  return h.name;
}

/* ---------- row / column insert & delete ---------- */
// rewrite every formula in the workbook after `n` rows/columns are inserted (n>0)
// or removed (n<0) at index `start` on sheet `target`
// `at` maps an old row/column index to its new one, or null if it no longer exists
function rewriteRefs(target,isCol,at){
  // one rewriter per owning sheet: an unqualified ref means "this sheet"
  const rwFor=owner=>str=>str.replace(REF_RE,(m,shn,d1,c1,d2,r1,d3,c2,d4,r2)=>{
      const onTarget=shn?sheetByName(shn.trim())===target:owner===target;
      if(!onTarget)return m;
      const idx=(col,row)=>isCol?colIdx(col):+row-1;
      const put=(dl,col,dlr,row,i)=>isCol?dl+colName(i)+dlr+row:dl+col+dlr+(i+1);
      const e1=idx(c1,r1),e2=c2?idx(c2,r2):null;
      const a1=at(e1),a2=c2?at(e2):undefined;
      if(!c2)return a1===null?"#REF":(shn?shn+"!":"")+put(d1,c1,d2,r1,a1);
      // a range only dies if both ends went; otherwise it covers whatever survived
      if(a1===null&&a2===null)return "#REF";
      const surv=[];
      for(let i=Math.min(e1,e2);i<=Math.max(e1,e2);i++){const t=at(i);if(t!=null)surv.push(t);}
      if(!surv.length)return "#REF";
      const lo=Math.min(...surv),hi=Math.max(...surv);
      return(shn?shn+"!":"")+put(d1,c1,d2,r1,lo)+":"+put(d3,c2,d4,r2,hi);
    });
  for(const s of wb.sheets){
    const rw=rwFor(s);
    for(const a in s.cells){
      const cl=s.cells[a];
      if(typeof cl.v==="string"&&cl.v[0]==="=")cl.v=rw(cl.v);
      if(cl.f&&cl.f.dv)cl.f.dv=rw(cl.f.dv); // dropdown sources are ranges too
    }
    // rules hold a painted range, a test reference, an exemplar cell, and maybe a source range
    for(const rule of s.rules||[]){
      if(rule.range)rule.range=rw(rule.range);
      if(rule.fmt)rule.fmt=rw(rule.fmt);
      if(rule.op==="in"&&rule.v1)rule.v1=rw(rule.v1);
      if(rule.test){
        const bare=rule.test.match(/^(?:([A-Za-z_][A-Za-z0-9_ ]*)!)?([A-Za-z]+)$/); // "K" or "Data!K"
        if(!bare)rule.test=rw(rule.test);                    // "K2" style: a normal ref
        else if(isCol&&(bare[1]?sheetByName(bare[1].trim()):s)===target){
          const i=at(colIdx(bare[2]));
          rule.test=i==null?"#REF":(bare[1]?bare[1]+"!":"")+colName(i);
        }
      }
    }
  }
}
// fn maps an old index to a new one, or null to drop it
function shiftRefs(target,start,n,isCol){
  rewriteRefs(target,isCol,i=>{
    if(n>0)return i>=start?i+n:i;
    const d=-n;
    if(i>=start+d)return i+n;
    return i>=start?null:i;
  });
}
function remap(sh,fn,isCol){
  const cells={},sizes={};
  const old=isCol?sh.colW:sh.rowH;
  for(const a in sh.cells){
    const m=a.match(/^([A-Z]+)(\d+)$/);
    if(isCol){const c=fn(colIdx(m[1]));if(c!=null)cells[colName(c)+m[2]]=sh.cells[a];}
    else{const r=fn(+m[2]-1);if(r!=null)cells[m[1]+(r+1)]=sh.cells[a];}
  }
  for(const k in old){const i=fn(+k);if(i!=null)sizes[i]=old[k];}
  sh.cells=cells;
  if(isCol)sh.colW=sizes;else sh.rowH=sizes;
}
function clampSel(){
  sel={c:Math.min(COLS-1,Math.max(0,sel.c)),r:Math.min(ROWS-1,Math.max(0,sel.r))};
  if(selEnd)selEnd={c:Math.min(COLS-1,Math.max(0,selEnd.c)),r:Math.min(ROWS-1,Math.max(0,selEnd.r))};
}
function insertAt(start,n,isCol){
  const sh=sheet();
  remap(sh,i=>i>=start?i+n:i,isCol);
  shiftRefs(sh,start,n,isCol);
  if(isCol)COLS+=n;else ROWS+=n;
  clip=null;clampSel();
  buildGrid();save();
}
function deleteAt(start,n,isCol){
  const sh=sheet();
  remap(sh,i=>i>=start+n?i-n:(i>=start?null:i),isCol);
  shiftRefs(sh,start,-n,isCol);
  if(isCol)COLS=Math.max(1,COLS-n);else ROWS=Math.max(1,ROWS-n);
  clip=null;clampSel();
  buildGrid();save();
}
// permutation for moving `count` items starting at `from` so they land before original index `to`
function movePerm(N,from,count,to){
  const order=[...Array(N).keys()];
  const block=order.splice(from,count);
  const ins=order.filter(i=>i<to).length;
  order.splice(ins,0,...block);
  const map=new Array(N);
  order.forEach((old,now)=>map[old]=now);
  return map;
}
function moveBlock(from,count,to,isCol){
  if(to>=from&&to<=from+count)return;           // dropped inside itself
  const sh=sheet(),N=isCol?COLS:ROWS;
  const map=movePerm(N,from,count,to);
  remap(sh,i=>i<N?map[i]:i,isCol);
  rewriteRefs(sh,isCol,i=>i<N?map[i]:i);
  clip=null;
  // keep the moved block selected at its new position
  const a=map[from],b=map[from+count-1];
  if(isCol){sel={c:Math.min(a,b),r:0};selEnd={c:Math.max(a,b),r:ROWS-1};}
  else{sel={c:0,r:Math.min(a,b)};selEnd={c:COLS-1,r:Math.max(a,b)};}
  buildGrid();save();
}

// which axis do the row/column buttons act on? full rows win when everything is selected
// whole-row / whole-column selections, used by the row/column insert-delete buttons
function fullRows(){const R=selRect();return R.c1===0&&R.c2===COLS-1?R:null;}
function fullCols(){const R=selRect();return R.r1===0&&R.r2===ROWS-1?R:null;}
function axisSel(){
  const R=fullRows();if(R)return{isCol:false,a:R.r1,b:R.r2};
  const C=fullCols();if(C)return{isCol:true,a:C.c1,b:C.c2};
  return null;
}
$("rcBefore").onclick=()=>{const A=axisSel();if(A)insertAt(A.a,A.b-A.a+1,A.isCol);};
$("rcAfter").onclick=()=>{const A=axisSel();if(A)insertAt(A.b+1,A.b-A.a+1,A.isCol);};
$("rcDel").onclick=()=>{const A=axisSel();if(A)deleteAt(A.a,A.b-A.a+1,A.isCol);};

/* ---------- dropdown UI ---------- */
const dvpanel=$("dvpanel");
// cells on this sheet carrying a dropdown, grouped by source range
function dvGroups(sh){
  const g=new Map();
  for(const a in sh.cells){
    const f=sh.cells[a].f;
    if(!f||!f.dv)continue;
    if(!g.has(f.dv))g.set(f.dv,[]);
    g.get(f.dv).push(a);
  }
  return g;
}
function dvCells(sh){let n=0;for(const a in sh.cells){const f=sh.cells[a].f;if(f&&f.dv)n++;}return n;}
// the button counts dropdowns the way the panel lists them — one per source range,
// however many cells share it; the cell tally stays in the tooltip
function dvSync(){
  let total=0;const parts=[];
  for(const sh of wb.sheets){
    const n=dvGroups(sh).size;
    total+=n;
    if(n)parts.push(sh.name+": "+n+" ("+dvCells(sh)+" cells)");
  }
  $("dvCount").textContent=total;
  $("dvWord").textContent=total===1?"Dropdown":"Dropdowns";
  $("dvOpen").title=parts.length?"Dropdowns — "+parts.join(", ")
                                :"No dropdowns in this workbook";
}
function dvClose(){dvpanel.hidden=true;dvpanel.innerHTML="";clearRefs();}
function dvOpenPanel(){
  if(MOB.matches)closeSheet();   // the bottom sheet would otherwise cover the panel
  dvpanel.hidden=false;
  dvRenderPanel();
  const b=$("dvOpen").getBoundingClientRect();
  dvpanel.style.left=Math.round(Math.max(8,Math.min(b.left,innerWidth-dvpanel.offsetWidth-8)))+"px";
  dvpanel.style.top=Math.round(b.bottom+6)+"px";
}
// bounding box of a set of addresses, for a compact description
function dvSpan(list){
  let c1=1e9,c2=-1,r1=1e9,r2=-1;
  for(const a of list){
    const m=a.match(/^([A-Z]+)(\d+)$/),c=colIdx(m[1]),r=+m[2]-1;
    c1=Math.min(c1,c);c2=Math.max(c2,c);r1=Math.min(r1,r);r2=Math.max(r2,r);
  }
  return c1===c2&&r1===r2?addr(c1,r1):addr(c1,r1)+":"+addr(c2,r2);
}
function dvRenderPanel(){
  const sh=sheet();
  dvpanel.innerHTML="";
  const head=document.createElement("div");head.id="dvhead";
  const t=document.createElement("b");t.textContent="Dropdowns";
  const hint=document.createElement("span");hint.className="hint";
  hint.textContent="click a field, then click or drag on the grid to pick";
  const x=document.createElement("button");x.textContent="Close";x.onclick=dvClose;
  head.append(t,hint,x);

  const body=document.createElement("div");body.id="dvbody";
  let any=false;
  for(const[si,shx]of wb.sheets.entries()){
  const groups=dvGroups(shx);
  if(!groups.size)continue;
  any=true;
  if(wb.sheets.length>1){
    const h=document.createElement("div");h.className="shhead";h.textContent=shx.name;
    body.appendChild(h);
  }
  for(const[src,list]of groups){
    const row=document.createElement("div");row.className="cfrow";
    const ok=!!cfBounds(shx,src);
    const desc=document.createElement("span");desc.className="desc grow";desc.style.fontSize="12px";
    desc.textContent=dvSpan(list)+"  ("+list.length+(list.length===1?" cell":" cells")+")  →  "+src;
    const go=document.createElement("button");go.textContent="Select";go.title="Select these cells";
    go.onclick=()=>{
      const m=dvSpan(list).split(":");
      const A=resolveRef(m[0],shx),B=resolveRef(m[1]||m[0],shx);
      if(si!==wb.active){wb.active=si;buildGrid();renderTabs();}
      sel={c:A.c,r:A.r};selEnd=(m[1]?{c:B.c,r:B.r}:null);
      paintSelection();
    };
    const del=document.createElement("button");del.textContent="✕";del.title="Remove these dropdowns";
    del.onclick=()=>{
      for(const a of list){const f=shx.cells[a]&&shx.cells[a].f;if(f)delete f.dv;}
      paintAll();save();dvSync();dvRenderPanel();
    };
    row.append(desc);
    if(!ok)row.append(Object.assign(document.createElement("span"),{className:"bad",textContent:"bad source"}));
    row.append(go,del);
    body.appendChild(row);
  }
  }
  if(!any){
    const e=document.createElement("div");e.className="cfrow";
    e.style.color="var(--ink-soft)";e.style.fontSize="12px";
    e.textContent="No dropdowns in this workbook. Define one below.";
    body.appendChild(e);
  }

  const foot=document.createElement("div");foot.id="dvfoot";
  const mk=(tag,cls,props)=>Object.assign(document.createElement(tag),props||{},cls?{className:cls}:{});
  const tgt=mk("input","rng");tgt.type="text";tgt.placeholder="C2:C40";tgt.value=cfDefaultRange();
  tgt.dataset.pick="range";tgt.title="Cells that get the dropdown";
  const src=mk("input","rng");src.type="text";src.placeholder="Data!A2:A12";
  src.dataset.pick="range";src.title="Range holding the allowed values";
  const apply=mk("button",null,{textContent:"Apply"});
  apply.onclick=()=>{
    const T=cfBounds(sh,tgt.value.trim()),S=src.value.trim();
    if(!T){alert("Pick the cells to put the dropdown in.");return;}
    if(!cfBounds(sh,S)){alert("Source must be a range like Data!A2:A12.");return;}
    for(let r=T.r1;r<=T.r2;r++)for(let c=T.c1;c<=T.c2;c++)(ensure(T.sh,addr(c,r)).f??={}).dv=S;
    paintAll();save();dvSync();dvRenderPanel();
  };
  const rem=mk("button",null,{textContent:"Remove"});
  rem.title="Remove dropdowns from the target range";
  rem.onclick=()=>{
    const T=cfBounds(sh,tgt.value.trim());
    if(!T)return;
    for(let r=T.r1;r<=T.r2;r++)for(let c=T.c1;c<=T.c2;c++){
      const cl=cell(T.sh,addr(c,r));if(cl&&cl.f)delete cl.f.dv;
    }
    paintAll();save();dvSync();dvRenderPanel();
  };
  foot.append(mk("span","lbl",{textContent:"cells"}),tgt,
              mk("span","lbl",{textContent:"choose from"}),src,apply,rem);
  dvpanel.append(head,body,foot);
  paintRefs();
}
$("dvOpen").onclick=()=>{if(dvpanel.hidden)dvOpenPanel();else dvClose();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!dvpanel.hidden&&!refTarget())dvClose();});

/* ---------- conditional format UI ---------- */
const cfpanel=$("cfpanel");
function cfCount(){return(sheet().rules||[]).length;}
function cfSync(){
  let total=0;const parts=[];
  for(const sh of wb.sheets){const n=(sh.rules||[]).length;total+=n;if(n)parts.push(sh.name+": "+n);}
  $("cfCount").textContent=total;
  $("cfOpen").title=parts.length?"Conditional format rules — "+parts.join(", ")
                                :"No conditional formatting in this workbook";
}
function cfChanged(){paintAll();save();cfSync();}
function cfDefaultRange(){
  const R=selRect();
  return R.c1===R.c2&&R.r1===R.r2?addr(R.c1,R.r1):addr(R.c1,R.r1)+":"+addr(R.c2,R.r2);
}
function cfClose(){cfpanel.hidden=true;cfpanel.innerHTML="";clearRefs();}
function cfOpen(){
  if(MOB.matches)closeSheet();   // the bottom sheet would otherwise cover the panel
  cfpanel.hidden=false;
  cfRenderPanel();
  const b=$("cfOpen").getBoundingClientRect();
  cfpanel.style.left=Math.round(Math.max(8,Math.min(b.left,innerWidth-cfpanel.offsetWidth-8)))+"px";
  cfpanel.style.top=Math.round(b.bottom+6)+"px";
}
function cfRow(rule,i,sh){
  const row=document.createElement("div");row.className="cfrow";
  const mk=(tag,cls,props)=>Object.assign(document.createElement(tag),props||{},cls?{className:cls}:{});
  const upd=()=>cfChanged();

  const prev=mk("span","prev");
  const f=cfFmt(sh,rule.fmt||"");
  prev.style.background=f&&f.bg||"#fff";prev.style.color=f&&f.color||"";
  prev.textContent=f&&f.color?"A":"";
  prev.title=f?"Preview of "+rule.fmt:"Exemplar not found";

  const rng=mk("input","rng");rng.type="text";rng.value=rule.range||"";rng.placeholder="B1:M100";
  rng.dataset.pick="range";rng.title="Cells this rule paints — click or drag on the grid to pick";
  rng.oninput=()=>{rule.range=rng.value.trim();upd();};

  const tst=mk("input","tst");tst.type="text";tst.value=rule.test||"";tst.placeholder="K";
  tst.dataset.pick="test";
  tst.title="What to examine: a column letter (same row), a cell like K2, or blank for each painted cell";
  tst.oninput=()=>{rule.test=tst.value.trim();upd();};

  const op=mk("select");
  for(const[v,label]of CF_OPS)op.append(new Option(label,v));
  op.value=rule.op||"==";
  op.onchange=()=>{rule.op=op.value;cfChanged();cfRenderPanel();};

  const v1=mk("input",rule.op==="in"?"rng":"val");v1.type="text";v1.value=rule.v1!=null?rule.v1:"";
  v1.placeholder=rule.op==="in"?"L2:L9":(rule.op==="between"?"low":"value");
  if(rule.op==="in")v1.dataset.pick="range";
  v1.oninput=()=>{rule.v1=v1.value;upd();};

  const fmt=mk("input","fmt");fmt.type="text";fmt.value=rule.fmt||"";fmt.placeholder="F3";
  fmt.dataset.pick="cell";fmt.title="Cell whose colors this rule copies — click a cell to pick it";
  fmt.oninput=()=>{rule.fmt=fmt.value.trim();cfChanged();prev.replaceWith(cfRowPreview(rule,sh,prev));};

  const del=mk("button");del.textContent="✕";del.title="Delete rule";
  del.onclick=()=>{sh.rules.splice(i,1);cfChanged();cfRenderPanel();};

  row.append(mk("span","lbl",{textContent:"if"}),tst,op,v1);
  if(rule.op==="between"){
    const lo=mk("select");lo.append(new Option("<","<"),new Option("≤","<="));lo.value=rule.lo||">";
    // stored as the operator applied to the cell value: ">" means "low < value"
    lo.value=rule.lo===">="?"<=":"<";
    lo.onchange=()=>{rule.lo=lo.value==="<="?">=":">";upd();};
    const cellLbl=mk("span","lbl",{textContent:"value"});
    const hi=mk("select");hi.append(new Option("<","<"),new Option("≤","<="));hi.value=rule.hi||"<=";
    hi.onchange=()=>{rule.hi=hi.value;upd();};
    const v2=mk("input","val");v2.type="text";v2.value=rule.v2!=null?rule.v2:"";v2.placeholder="high";
    v2.oninput=()=>{rule.v2=v2.value;upd();};
    row.append(lo,cellLbl,hi,v2);
  }
  row.append(mk("span","lbl",{textContent:"paint"}),rng,mk("span","lbl",{textContent:"like"}),fmt,prev);
  if(!cfBounds(sh,rule.range||""))row.append(mk("span","bad",{textContent:"bad range"}));
  else if(rule.test&&rule.test.trim()&&!cfTestRef(sh,rule.test))row.append(mk("span","bad",{textContent:"bad test ref"}));
  else if(!f)row.append(mk("span","bad",{textContent:"no such cell"}));
  row.append(mk("span","grow"),del);
  return row;
}
function cfRowPreview(rule,sh,old){
  const f=cfFmt(sh,rule.fmt||"");
  const prev=document.createElement("span");prev.className="prev";
  prev.style.background=f&&f.bg||"#fff";prev.style.color=f&&f.color||"";
  prev.textContent=f&&f.color?"A":"";
  return prev;
}
function cfRenderPanel(){
  const sh=sheet();sh.rules=sh.rules||[];
  cfpanel.innerHTML="";
  const head=document.createElement("div");head.id="cfhead";
  const t=document.createElement("b");t.textContent="Conditional formatting";
  const hint=document.createElement("span");hint.className="hint";
  hint.textContent="click a field, then click the grid (or a column header) to pick";
  const x=document.createElement("button");x.textContent="Close";x.onclick=cfClose;
  head.append(t,hint,x);
  const body=document.createElement("div");body.id="cfbody";
  let any=false;
  for(const shx of wb.sheets){
    shx.rules=shx.rules||[];
    if(!shx.rules.length)continue;
    any=true;
    if(wb.sheets.length>1){
      const h=document.createElement("div");h.className="shhead";h.textContent=shx.name;
      body.appendChild(h);
    }
    shx.rules.forEach((r,i)=>body.appendChild(cfRow(r,i,shx)));
  }
  if(!any){
    const e=document.createElement("div");e.className="cfrow";
    e.style.color="var(--ink-soft)";e.style.fontSize="12px";
    e.textContent="No rules yet. Add one below.";
    body.appendChild(e);
  }
  const foot=document.createElement("div");foot.id="cffoot";
  const add=document.createElement("button");add.textContent="+ Add rule";
  add.onclick=()=>{
    sh.rules.push({range:cfDefaultRange(),test:"",op:"==",v1:"",fmt:""});
    cfChanged();cfRenderPanel();
  };
  const note=document.createElement("span");note.className="hint";
  note.textContent="added to "+sheet().name+" · first matching rule wins · a rule overrides the cell's own colors";
  foot.append(add,note);
  cfpanel.append(head,body,foot);
  paintRefs();
}
$("cfOpen").onclick=()=>{if(cfpanel.hidden)cfOpen();else cfClose();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!cfpanel.hidden&&!refTarget())cfClose();});
// clicking away dismisses either panel. The exception is an armed range/cell picker:
// picking happens by clicking the grid, which would otherwise close the panel underneath it.
// Capture phase, so activeElement is still the picker field when we ask.
document.addEventListener("mousedown",e=>{
  if(refTarget())return;
  const t=e.target,outside=(panel,btn)=>!panel.contains(t)&&t!==btn&&!btn.contains(t);
  if(!dvpanel.hidden&&outside(dvpanel,$("dvOpen")))dvClose();
  if(!cfpanel.hidden&&outside(cfpanel,$("cfOpen")))cfClose();
},true);

/* ---------- document name ---------- */
function safeName(){return(wb.name||"Simple xlsx").replace(/[\\/:*?"<>|]/g,"-").trim()||"Simple xlsx";}
function applyName(){document.title=wb.name||"Simple xlsx";}
function renameFromUI(){
  const n=$("appname").textContent.replace(/\s+/g," ").trim();
  wb.name=n||"Simple xlsx";
  applyName();save();
}
$("appname").addEventListener("input",renameFromUI);
$("appname").addEventListener("blur",()=>{$("appname").textContent=wb.name||"Simple xlsx";});
$("appname").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();$("appname").blur();focusGrid(true);}
  else if(e.key==="Escape"){e.preventDefault();$("appname").textContent=wb.name||"Simple xlsx";$("appname").blur();focusGrid(true);}
});

/* ---------- phone layout ----------
   Below 898px the toolbar is only an app bar; its groups live in the bottom
   icon strip, the overflow menu and the header context menus. Nothing here
   builds a second copy of any control: openSheet() moves the real .grp node
   into the bottom sheet and putBack() returns it, so the existing handlers,
   ids and disabled states keep working untouched. */
const MOB=matchMedia("(max-width:897px)");
let msEl=null,msAt=null,msIn=null;          // what is on loan, and where from
function putBack(){
  if(msEl)msIn.insertBefore(msEl,msAt);     // exactly where it was, so the wide layout survives
  msEl=msAt=msIn=null;
}
function closeSheet(){
  putBack();
  $("msheet").hidden=$("mscrim").hidden=true;
}
function openSheet(el,title){
  closeSheet();hideMenu();
  msEl=el;msIn=el.parentNode;msAt=el.nextSibling;
  $("msbody").appendChild(el);
  $("mshead").firstChild.textContent=title;
  $("msheet").hidden=$("mscrim").hidden=false;
}
$("mshx").onclick=closeSheet;
$("mscrim").onclick=closeSheet;
// the strip is built once, from the groups themselves, and holds live references:
// after the first openSheet() a group is no longer a child of #toolbar to re-query
(()=>{
  const strip=$("mstrip");
  for(const g of document.querySelectorAll("#toolbar .grp[data-ic]")){
    const name=g.querySelector(".glabel").textContent;
    const b=document.createElement("button");
    b.innerHTML='<span></span><span class="lb"></span>';
    b.firstChild.textContent=g.dataset.ic;
    b.lastChild.textContent=name;
    b.title=name;
    b.onclick=()=>openSheet(g,name);
    strip.appendChild(b);
  }
})();
$("movf").onclick=()=>openSheet($("toolbar").querySelector(".grp.right"),"File");
$("tglbar").onclick=()=>openSheet($("tabs"),"Sheets");

/* Context menus. The items are proxies for the real toolbar buttons — label,
   disabled state and click all come from the button itself, so the dynamic
   "Insert 3 rows" wording and the paste buttons' enablement are inherited
   rather than reimplemented. */
function hideMenu(){$("mmenu").hidden=true;}
function showMenu(x,y,ids){
  const m=$("mmenu");
  m.textContent="";
  let any=false;
  for(const id of ids){
    const src=$(id);
    const b=document.createElement("button");
    b.textContent=src.textContent;
    b.disabled=src.disabled;
    if(!src.disabled)any=true;
    b.onclick=()=>{hideMenu();src.click();};
    m.appendChild(b);
  }
  if(!any)return;                            // nothing actionable: say nothing
  m.hidden=false;
  // clamp into the viewport now that it has a size
  const w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.round(Math.max(6,Math.min(x,innerWidth-w-6)))+"px";
  m.style.top=Math.round(Math.max(6,Math.min(y,innerHeight-h-6)))+"px";
}
/* A long press is spelled out rather than left to the `contextmenu` event,
   which mobile Safari does not fire reliably for one. Movement past a few
   pixels means the user is scrolling or drag-selecting, so the press is off. */
$("gridwrap").addEventListener("pointerdown",e=>{
  if(!MOB.matches||e.pointerType==="mouse"||editing)return;
  const th=e.target.closest("th"),td=e.target.closest("td");
  if(!th&&!td)return;
  const x0=e.clientX,y0=e.clientY;
  const t=setTimeout(()=>{
    off();
    if(th){
      const cs=th.dataset.c,rs=th.dataset.r;
      if(cs===undefined&&rs===undefined)return;
      selectBand(cs!==undefined,+(cs!==undefined?cs:rs),+(cs!==undefined?cs:rs));
      showMenu(x0,y0,["rcBefore","rcAfter","rcDel"]);
    }
    else showMenu(x0,y0,["pasteAll","pasteVals","pasteFmt"]);
  },450);
  const mv=ev=>{if(Math.abs(ev.clientX-x0)>8||Math.abs(ev.clientY-y0)>8)off();};
  function off(){clearTimeout(t);removeEventListener("pointermove",mv);
    removeEventListener("pointerup",off);removeEventListener("pointercancel",off);}
  addEventListener("pointermove",mv);addEventListener("pointerup",off);
  addEventListener("pointercancel",off);
});
// suppress the OS text-selection callout that would otherwise race the long press
$("gridwrap").addEventListener("contextmenu",e=>{if(MOB.matches)e.preventDefault();});
document.addEventListener("pointerdown",e=>{if(!$("mmenu").hidden&&!e.target.closest("#mmenu"))hideMenu();},true);
// leaving the phone breakpoint must hand every borrowed group back to the toolbar
MOB.addEventListener("change",()=>{closeSheet();hideMenu();});

/* ---------- boot ---------- */
load();
if(!wb.name)wb.name="Simple xlsx";
$("appname").textContent=wb.name;
applyName();
fitRows();
lastSnap=snapshot();
buildGrid();
renderTabs();
</script>
