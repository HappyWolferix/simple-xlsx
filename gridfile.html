<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="1.1.0">
<title>Simple xlsx</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --line:#dde3ea; --line-strong:#c3ccd6;
  --ink:#1c2733; --ink-soft:#5b6b7c; --accent:#0e6e6a; --accent-soft:#e2f1f0;
  --sel:#0e6e6a; --sel-fill:rgba(14,110,106,.08); --head:#eef1f5;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button[aria-pressed="true"]{background:var(--sel-fill);border-color:var(--accent);color:var(--accent)}
input:disabled{opacity:.45;cursor:default}
label:has(input:disabled){opacity:.6}
.swdot{display:inline-block;width:12px;height:12px;border:1px solid rgba(0,0,0,.28);border-radius:3px;vertical-align:-2px;background:#fff}
.bdico{display:inline-block;width:12px;height:12px;border:1px dashed rgba(0,0,0,.22);vertical-align:-2px;background:#fff}
.bdico.on{border:1px solid #000}
#cpop{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px}
#cpop[hidden]{display:none}
#cpop .grid{display:grid;grid-template-columns:repeat(5,20px);gap:4px}
#cpop .row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--ink-soft)}
#cpop .row input[type=color]{width:28px;height:20px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.sw{width:20px;height:20px;padding:0;border:1px solid rgba(0,0,0,.22);border-radius:4px;cursor:pointer;background-clip:padding-box}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px}
#cpop .none{width:100%;background:#fff;position:relative;overflow:hidden;height:22px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--ink-soft);cursor:pointer}
#fapop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:12px;max-width:min(560px,94vw);overflow:hidden}
#fapop[hidden]{display:none}
#fapop .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
#fapop .sig{padding:5px 8px;white-space:normal;word-break:break-word}
#fapop .sig b{color:var(--accent);font-weight:600;background:var(--accent-soft);border-radius:3px}
#fapop .desc{padding:0 8px 5px;color:var(--ink-soft)}
#fapop .foot{border-top:1px solid var(--line);padding:3px 8px;color:var(--ink-soft);font-size:11px}
#fapop ul{list-style:none;margin:0;padding:0;max-height:196px;overflow-y:auto}
#fapop li{padding:3px 8px;cursor:pointer;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
#fapop li.on{background:var(--accent-soft)}
#fapop li .nm{font-weight:600}
#fapop li .ar{color:var(--ink-soft)}
#fapop li .ds{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;margin-left:auto;padding-left:12px}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* toolbar */
#toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#toolbar .grp{display:flex;flex-direction:column;gap:3px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
#toolbar .grp:last-child{border-right:0}
#toolbar .grp.right{margin-left:auto;padding-right:0;border-right:0}
#toolbar .gitems{display:flex;gap:6px;align-items:center}
#toolbar .glabel{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);opacity:.75}
#appname{align-self:center}
#toolbar label{color:var(--ink-soft)}
#toolbar input[type=color]{width:26px;height:26px;padding:1px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
#toolbar input[type=number],#toolbar input[type=text],#toolbar select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel)}
#appname{font-weight:600;letter-spacing:.02em;color:var(--accent);margin-right:6px;padding:2px 4px;border-radius:4px;cursor:text;outline:none}
#appname:hover{background:var(--head)}
#appname:focus{background:#fff;box-shadow:0 0 0 2px var(--accent)}

/* formula bar */
#fbar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#cellname{min-width:64px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--head);color:var(--ink-soft)}
#finput{flex:1;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* grid */
#gridwrap{flex:1;overflow:auto;background:var(--panel)}
/* the grid container holds keyboard focus, so suppress the caret the browser would draw in it */
#gridwrap:focus{outline:none}
#gridwrap,#gridwrap *{caret-color:transparent}
#editor,#gridwrap input,#gridwrap select{caret-color:auto}
table{border-collapse:collapse;table-layout:fixed}/* width is pinned in px by sizeTable() */
th,td{border:1px solid var(--line);padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#fff}
th{background:var(--head);color:var(--ink-soft);font-weight:500;position:sticky;user-select:none;cursor:pointer}
th.hsel{background:var(--sel);color:#fff;cursor:grab}
thead th{top:0;z-index:3}
tbody th{left:0;z-index:2;text-align:right;padding-right:6px}
thead th:first-child{left:0;z-index:4}
td{cursor:cell;user-select:none;-webkit-user-select:none;position:relative}
td.num{text-align:right}
td.sel{outline:2px solid var(--sel);outline-offset:-2px}
/* tints are overlays, not background-image: a cell fill is set via the inline background shorthand and would win */
td.inrange::after{content:"";position:absolute;inset:0;background:var(--sel-fill);pointer-events:none}
td.ref{outline:2px dashed var(--ref-c);outline-offset:-2px}
td.ref::before{content:"";position:absolute;inset:0;background:var(--ref-f);pointer-events:none}
td.ref0{--ref-c:#1a73e8;--ref-f:rgba(26,115,232,.10)}
td.ref1{--ref-c:#e8710a;--ref-f:rgba(232,113,10,.10)}
td.ref2{--ref-c:#9334e6;--ref-f:rgba(147,52,230,.10)}
td.ref3{--ref-c:#188038;--ref-f:rgba(24,128,56,.10)}
td.ref4{--ref-c:#c5221f;--ref-f:rgba(197,34,31,.10)}
td.clip{outline:2px dashed var(--sel);outline-offset:-2px}
td.filling{outline:1px dashed var(--sel);outline-offset:-1px}
td.err{color:#b3261e}
td .dvmark{float:right;color:var(--ink-soft);font-size:14px;line-height:20px;margin-left:2px;cursor:pointer}
#dvpanel,#cfpanel{position:fixed;display:none;z-index:40;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:0;width:min(1040px,96vw);
  max-height:70vh;display:none;flex-direction:column}
#dvpanel:not([hidden]),#cfpanel:not([hidden]){display:flex}
#dvhead,#cfhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
#dvhead b{flex:1;font-size:13px}
#cfhead b{flex:1;font-size:13px}
#cfhead .hint{font-size:11px;color:var(--ink-soft)}
#dvbody,#cfbody{overflow:auto;padding:6px 12px}
#dvfoot,#cffoot{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.cfrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap}
/* one rule per line: the sized controls keep their width and #cfbody scrolls sideways
   if the row is wider than the panel, rather than folding onto a second line */
.cfrow>*{flex:none}
.cfrow .lbl,.cfrow .bad{white-space:nowrap}
.cfrow:last-child{border-bottom:0}
.cfrow .lbl{font-size:11px;color:var(--ink-soft)}
.cfrow input[type=text]{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff}
.cfrow select{border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:#fff}
.cfrow .rng{width:110px;font-family:ui-monospace,Menlo,Consolas,monospace}
.cfrow .tst{width:64px;font-family:ui-monospace,Menlo,Consolas,monospace;text-align:center}
.cfrow .val{width:90px}
.cfrow .fmt{width:96px;font-family:ui-monospace,Menlo,Consolas,monospace}
.cfrow .prev{width:22px;height:22px;border:1px solid rgba(0,0,0,.22);border-radius:4px;flex:none;
  font-size:11px;text-align:center;line-height:21px}
.cfrow .bad{color:#b3261e;font-size:11px}
.cfrow .grow{flex:1 1 auto;min-width:0}
.shhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
  padding:6px 0 2px;border-bottom:1px solid var(--line)}
#dvfoot input[type=text]{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;
  width:120px;font-family:ui-monospace,Menlo,Consolas,monospace}
#dvfoot .lbl,#cffoot .lbl{font-size:11px;color:var(--ink-soft)}
#dvbody .desc{font-family:ui-monospace,Menlo,Consolas,monospace}
input[data-pick]:focus{box-shadow:0 0 0 2px var(--accent)}
#savetip{position:fixed;display:none;z-index:31;left:50%;transform:translateX(-50%);bottom:18px;
  background:var(--ink);color:#fff;font-size:12px;padding:6px 12px;border-radius:6px;
  pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#sizetip{position:fixed;display:none;z-index:30;background:var(--ink);color:#fff;font-size:11px;
  padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#dropline{position:absolute;display:none;background:var(--accent);z-index:8;pointer-events:none;border-radius:1px}
#grow{margin:6px 0 12px 44px}
/* the column extender lives past the last column header; its lane spans the full grid
   height so the button can stick to the top edge while the sheet scrolls under it */
#colgrow{position:absolute;top:0;bottom:0;padding-left:8px}
#colgrow button{position:sticky;top:0}
#grow button,#colgrow button{font-size:12px;color:var(--ink-soft);border:0;background:none;
  padding:0;cursor:pointer;white-space:nowrap;line-height:22px}
#grow button:disabled,#colgrow button:disabled{opacity:.45;cursor:default}
#fill{position:absolute;width:8px;height:8px;background:var(--sel);border:1px solid #fff;cursor:crosshair;z-index:5}
#editor{position:absolute;z-index:6;border:2px solid var(--sel);padding:0 4px;font:inherit;display:none;background:#fff}
select#editor{padding:0}
/* grab zone straddles the border: 10% of the column width / row height on each side */
.rsz-c{position:absolute;top:0;right:-10%;width:20%;min-width:6px;height:100%;cursor:col-resize}
.rsz-r{position:absolute;left:0;bottom:-10%;height:20%;min-height:6px;width:100%;cursor:row-resize}
th{position:sticky}
thead th,tbody th{overflow:visible}
thead th>div,tbody th>div{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}

/* tabs */
#tabs{display:flex;gap:2px;align-items:center;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line)}
#tabs .tab{padding:4px 12px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;cursor:pointer;color:var(--ink-soft);background:var(--head)}
#tabs .tab.on{background:#fff;color:var(--accent);border-color:var(--accent);font-weight:600}
#status{margin-left:auto;color:var(--ink-soft)}
#status .ver{margin-left:10px;opacity:.45;font-size:11px;font-variant-numeric:tabular-nums}

/* narrow screens — note this is CSS, so it deliberately avoids the
   ---------- name ---------- marker shape the build keeps for the script.
   Three breakpoints, and width is the only thing they ask about — a phone and a
   desktop window dragged narrow get the same layout. How the pointer behaves is
   a separate question, so the finger-sized targets live in their own
   pointer:coarse block at the end.

   The full menu is allowed at most two rows: show it whenever the groups fit in
   one or two rows, and hand over to the mobile bar the moment they would need a
   third. Both cut-over widths are therefore measured, not chosen — they are the
   points where this exact set of groups changes wrapped row count, and they
   must be re-measured if a group's buttons or labels change (drag the window
   and watch where the toolbar gains a row):

     >=1730px  the wide layout above, untouched — every group fits ONE row
     898–1729  same captioned, divider-separated groups, wrapped into exactly
               TWO rows: rows packed to the top, and the File group flowing
               inline (its margin-left:auto dropped) so it fills the gap on the
               first row rather than being stranded far right
     <898px    a third row would be needed, so instead the toolbar becomes a
               44px app bar and its groups move to the bottom icon strip, the
               overflow menu, and the header context menus

   Below 898px nothing is duplicated: openSheet() physically moves the live .grp
   element into the bottom sheet and puts it back on close, so every control
   keeps the wiring it already had. That is why the hide rule is scoped to the
   direct children of #toolbar — a group that has been moved out must show. */
@media (min-width:898px) and (max-width:1729px){
  /* The desktop toolbar — one row of captioned, divider-separated groups — reads
     well; it only looks wrong once it has to wrap. So keep that exact group
     style here (captions on, dividers on) and just tidy the wrap: rows packed to
     the top with a clear gap between them, and the File group flowing inline
     after the others instead of being flung to the far right of its row by
     margin-left:auto — so it fills a gap on the row above when one fits and
     drops to its own row only when it genuinely has to. */
  #toolbar{align-content:flex-start;row-gap:10px}
  #toolbar .grp.right{margin-left:0}
}
/* dvh, not vh: on mobile Safari 100vh is the height with the browser chrome
   retracted, so a vh-sized grid hides its last rows under the toolbar. */
@supports(height:100dvh){body{height:100dvh}}
#mstrip,#msheet,#mscrim,#mmenu,#movf,#tglbar{display:none}
@media (max-width:897px){
  /* app bar: ☰ sheets · name · ⋯ overflow */
  #toolbar{flex-wrap:nowrap;gap:4px;padding:0 4px;min-height:44px}
  #toolbar>.grp{display:none}
  #tglbar,#movf{display:block;flex:none;background:none;border:0;font-size:17px;padding:0 10px;line-height:1}
  #movf{margin-left:auto}
  #appname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
  #fbar{gap:6px;padding:5px 6px}
  #cellname{min-width:56px;flex:none}/* fixed name box, input takes the rest */
  #finput{min-width:0}
  #tabs{display:none}/* the sheet list moved into the ☰ menu */
  #grow{margin-left:10px}
  /* bottom icon strip, clear of the home indicator */
  /* directly under the app bar and above the formula bar: the actions stay
     where the eye looks for them, in the same place on every screen */
  #mstrip{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--panel);
    border-bottom:1px solid var(--line);padding:2px 4px}
  #mstrip::-webkit-scrollbar{display:none}
  #mstrip button{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;min-width:56px;min-height:44px;border:0;background:none;font-size:16px;padding:2px 6px}
  #mstrip button .lb{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
  #mstrip button:hover{color:inherit}
  /* bottom sheet: hosts whichever group was tapped */
  #mscrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.32)}
  #msheet{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:46;
    background:var(--panel);border-radius:14px 14px 0 0;box-shadow:0 -6px 26px rgba(0,0,0,.24);
    max-height:76dvh;padding-bottom:env(safe-area-inset-bottom)}
  #mscrim[hidden],#msheet[hidden],#mmenu[hidden]{display:none}
  #mshead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
  #mshead b{flex:1;font-size:13px}
  #mshead button{border:0;background:none;font-size:16px;padding:4px 8px}
  #msbody{overflow:auto;padding:10px 12px}
  #msbody .grp{display:flex;border:0;padding:0;margin:0;flex-direction:column;align-items:stretch;gap:8px}
  #msbody .gitems{flex-wrap:wrap;gap:8px}
  #msbody .glabel{display:none}/* the sheet title already says it */
  #msbody .gitems button{flex:1 1 auto;min-height:44px}
  #msbody button{min-height:44px}
  #msbody #tabs .tab,#msbody #tabs button{flex:none}
  #msbody #tabs{display:flex;flex-wrap:wrap;border:0;padding:0;gap:6px}
  #msbody #tabs .tab{border-radius:6px;border-bottom:1px solid var(--line);min-height:40px;padding:6px 14px}
  /* #status carries the mouse-only tab hints and the version number in one
     element; zero the font so only the sized .ver span survives, since the
     README promises every copy shows its version somewhere. */
  #msbody #status{margin:0;font-size:0}
  #msbody #status .ver{font-size:11px;margin:0}
  /* long-press menu on a header or the selection */
  #mmenu{display:block;position:fixed;z-index:47;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.24);padding:4px;min-width:184px}
  #mmenu button{display:block;width:100%;text-align:left;border:0;background:none;min-height:44px;padding:0 12px}
  #mmenu button:disabled{opacity:.4}
  /* Both panels are positioned inline from the trigger button's rect, which on a
     phone is inside the bottom sheet — that put them off the bottom of the
     screen and, at z-index 40, behind the sheet and its scrim. Pin them to the
     bottom edge instead and lift them above the sheet. Capped well short of the
     full height because both panels ask the user to tap a field and then tap the
     grid to pick a range, which needs some grid left to tap. */
  /* The colour palette is positioned in document coordinates from its button,
     so it lands below the fold and behind the sheet for the same reason. It
     stacks ON TOP of the sheet rather than closing it, so Text and Fill can be
     picked one after the other. 20px swatches are also far too small to hit. */
  #cpop{position:fixed;left:0!important;right:0;top:auto!important;bottom:0;width:100vw;
    z-index:47;border-radius:14px 14px 0 0;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  #cpop .grid{grid-template-columns:repeat(8,1fr);gap:6px}
  #cpop .sw{width:100%;height:38px}
  #cpop .none{height:38px}
  #cpop .row{min-height:44px}
  #dvpanel,#cfpanel{width:100vw;max-width:100vw;left:0!important;right:0;top:auto!important;
    bottom:0;max-height:62dvh;z-index:47;border-radius:14px 14px 0 0;
    padding-bottom:env(safe-area-inset-bottom)}
  #dvhead,#cfhead,#dvfoot,#cffoot{padding:8px}
  #dvbody,#cfbody{padding:6px 8px}
  /* The desktop rule keeps each rule on one line and scrolls #cfbody sideways
     (see .cfrow above). On a phone that hides the colour preview and the delete
     button behind a horizontal scroll, so here the row wraps instead. */
  .cfrow{flex-wrap:wrap;gap:6px 8px}
  #cfhead .hint{display:none}
}
/* Touch, at any width: finger-sized targets, and 16px inputs so mobile Safari
   does not zoom the page when one takes focus. */
@media (pointer:coarse){
  button{padding:6px 10px;min-height:34px}
  #toolbar select,#toolbar input[type=number]{min-height:34px}
  #toolbar input[type=color]{width:32px;height:32px}
  #finput,#editor,#toolbar select,#msbody select,#msbody input{font-size:16px}
  #gridwrap{-webkit-overflow-scrolling:touch}
  td,th{user-select:none;-webkit-touch-callout:none}
}
</style>
</head>
<body>
<div id="toolbar">
  <button id="tglbar" title="Sheets">☰</button>
  <span id="appname" contenteditable="plaintext-only" spellcheck="false" title="Click to rename">Simple xlsx</span>
  <button id="movf" title="More">⋯</button>
  <div class="grp" data-ic="🎨">
    <span class="glabel">Colors</span>
    <div class="gitems">
      <button id="fgBtn" title="Text color">Text <span class="swdot" id="fgDot"></span></button>
      <button id="bgBtn" title="Fill color">Fill <span class="swdot" id="bgDot"></span></button>
      <button id="boldBtn" title="Bold (Ctrl+B) — toggle on the selection" aria-pressed="false"><b>B</b></button>
      <button id="bdOn" title="Fill border — black outline around the selection"><span class="bdico on"></span></button>
      <button id="bdOff" title="Remove border — clear the outline around the selection"><span class="bdico"></span></button>
    </div>
  </div>
  <div class="grp" data-ic="123">
    <span class="glabel">Data type</span>
    <div class="gitems">
      <select id="cellType" title="Cell type"><option value="auto">Auto</option><option value="number">Number</option><option value="text">Text</option><option value="date">Date</option></select>
      <label>Decimals <input type="number" id="decimals" min="0" max="10" style="width:52px" placeholder="—"></label>
    </div>
  </div>
  <div class="grp" data-ic="▦">
    <span class="glabel">Rows &amp; columns</span>
    <div class="gitems">
      <button id="rcBefore" disabled>Insert before</button>
      <button id="rcAfter" disabled>Insert after</button>
      <button id="rcDel" disabled>Delete</button>
    </div>
  </div>
  <div class="grp" data-ic="▾">
    <span class="glabel">Dropdown</span>
    <div class="gitems">
      <button id="dvOpen"><span id="dvCount">0</span> <span id="dvWord">Dropdowns</span></button>
    </div>
  </div>
  <div class="grp" data-ic="✓">
    <span class="glabel">Conditional format</span>
    <div class="gitems">
      <button id="cfOpen"><span id="cfCount">0</span> Rules</button>
    </div>
  </div>
  <div class="grp" data-ic="📋">
    <span class="glabel">Clipboard</span>
    <div class="gitems">

<script>
"use strict";
// the page exactly as it was loaded, before any generated DOM: the template we save back out
const PRISTINE="<!doctype html>\n"+document.documentElement.outerHTML;
/* ---------- version ----------
   Bump this and the <meta name="app-version"> in <head> together on every release.
   It rides along in downloaded copies, so a user can always tell you which build
   they have: it is shown at the right end of the sheet-tab bar. */
const APP_VERSION=document.querySelector('meta[name="app-version"]').content;
/* ---------- state ---------- */
let COLS=26, ROWS=100;
// default column width. Narrower on a phone so four or five columns are visible
// at once rather than three; an explicit width in sheet.colW always wins.
let DEFW=innerWidth<700?64:90;
// spreadsheet-style base-26: 0->A, 25->Z, 26->AA
const colName=i=>{let s="",n=i+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26;}return s;};
const colIdx=s=>{let n=0;for(const ch of s.toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1;};
const newSheet=name=>({name,cells:{},colW:{},rowH:{},rules:[]});
let wb={sheets:[newSheet("Sheet1"),newSheet("Data")],active:0};
let sel={r:0,c:0}, selEnd=null;      // selection anchor + optional range end
const $=id=>document.getElementById(id);

function sheet(){return wb.sheets[wb.active];}
function addr(c,r){return colName(c)+(r+1);}
function cell(sh,a){return sh.cells[a];}
function ensure(sh,a){return sh.cells[a]||(sh.cells[a]={});}
function sheetByName(n){n=n.toLowerCase();return wb.sheets.find(s=>s.name.toLowerCase()===n);}

/* ---------- formula engine ---------- */
const REF=/^(?:([A-Za-z_][A-Za-z0-9_ ]*)!)?(\$?)([A-Z]+)(\$?)(\d+)$/;

function tokenize(src){
  const t=[];let i=0;
  const isD=c=>c>="0"&&c<="9";
  while(i<src.length){
    const c=src[i];
    if(c===" "){i++;continue;}
    if(isD(c)||(c==="."&&isD(src[i+1]))){let j=i;while(j<src.length&&(isD(src[j])||src[j]==="."))j++;t.push({k:"num",v:parseFloat(src.slice(i,j))});i=j;continue;}
    if(c==='"'){let j=i+1,s="";while(j<src.length&&src[j]!=='"'){s+=src[j++];}t.push({k:"str",v:s});i=j+1;continue;}
    if(/[A-Za-z_$]/.test(c)){
      let j=i;while(j<src.length&&/[A-Za-z0-9_$ ]/.test(src[j]))j++;
      let word=src.slice(i,j).trim();
      if(src[j]==="!"){ // sheet-qualified ref
        let k=j+1,ref="";while(k<src.length&&/[$A-Za-z0-9]/.test(src[k]))ref+=src[k++];
        t.push({k:"ref",v:word+"!"+ref});i=k;continue;
      }
      if(src[j]==="("){t.push({k:"fn",v:word.toUpperCase()});i=j;continue;}
      if(REF.test(word)&&/\d/.test(word)){t.push({k:"ref",v:word});i=j;continue;}
      if(word.toUpperCase()==="TRUE"){t.push({k:"num",v:true});i=j;continue;}
      if(word.toUpperCase()==="FALSE"){t.push({k:"num",v:false});i=j;continue;}
      t.push({k:"str",v:word});i=j;continue;
    }
    if("<>".includes(c)){
      let op=c;if(src[i+1]==="="||(c==="<"&&src[i+1]===">"))op+=src[++i];
      t.push({k:"op",v:op});i++;continue;
    }
    if("+-*/^&%()=:,;".includes(c)){t.push({k:"op",v:c});i++;continue;}
    throw"char "+c;
  }
  return t;
}

function parse(t){
  let p=0;
  const peek=()=>t[p], eat=v=>{if(!t[p]||t[p].v!==v)throw"expected "+v;p++;};
  const op=v=>{const k=t[p];return!!k&&k.k==="op"&&(v?k.v===v:true);};
  function expr(){ // comparison
    let l=cat();
    if(op()&&["=","<>","<",">","<=",">="].includes(peek().v)){
      const op=t[p++].v;const r=cat();return{k:"cmp",op,l,r};
    }
    return l;
  }
  function cat(){let l=add();while(op("&")){p++;l={k:"cat",l,r:add()};}return l;}
  function add(){let l=mul();while(op("+")||op("-")){const op=t[p++].v;l={k:"bin",op,l,r:mul()};}return l;}
  function mul(){let l=pow();while(op("*")||op("/")){const op=t[p++].v;l={k:"bin",op,l,r:pow()};}return l;}
  // ^ binds tighter than * / and looser than unary minus, so -2^2 is 4 as in Excel
  function pow(){let l=un();if(op("^")){p++;return{k:"bin",op:"^",l,r:pow()};}return l;}
  function un(){if(op("-")||op("+")){const m=t[p++].v;const e=un();return m==="-"?{k:"neg",e}:e;}return pct();}
  function pct(){let e=atom();while(op("%")){p++;e={k:"pct",e};}return e;}
  function atom(){
    const tk=peek();if(!tk)throw"end";
    if(tk.k==="num"||tk.k==="str"){p++;return{k:"lit",v:tk.v};}
    if(tk.k==="fn"){p++;eat("(");const args=[];if(peek()&&peek().v!==")"){args.push(expr());while(op(",")||op(";")){p++;args.push(expr());}}eat(")");return{k:"call",fn:tk.v,args};}
    if(tk.k==="ref"){p++;
      if(op(":")){p++;const r2=t[p];if(!r2||r2.k!=="ref")throw"range";p++;return{k:"range",a:tk.v,b:r2.v};}
      return{k:"ref",v:tk.v};}
    if(tk.k==="op"&&tk.v==="("){p++;const e=expr();eat(")");return e;}
    throw"unexpected "+tk.v;
  }
  const e=expr();if(p<t.length)throw"trailing";return e;
}

function resolveRef(refStr,curSheet){
  const m=refStr.match(REF);if(!m)throw"ref "+refStr;
  const sh=m[1]?sheetByName(m[1]):curSheet;if(!sh)throw"sheet "+m[1];
  return{sh,c:colIdx(m[3]),r:parseInt(m[5])-1};
}
const NUM_RE=/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
// strict: a string must be numeric in full ("11,22" is text, not 11)
function isNum(v){
  if(typeof v==="number")return isFinite(v);
  if(typeof v==="boolean")return true;
  return typeof v==="string"&&NUM_RE.test(v.trim());
}
function num(v){
  if(v===""||v==null)return 0;
  if(typeof v==="number")return v;
  if(typeof v==="boolean")return v?1:0;
  const t=String(v).trim();
  if(!NUM_RE.test(t))throw E_VAL;
  return parseFloat(t);
}

function evalNode(n,sh,vis){
  switch(n.k){
    case"lit":return n.v;
    case"neg":return -num(argVal(n.e,sh,vis));
    case"pct":return num(argVal(n.e,sh,vis))/100;
    case"cat":return txt(argVal(n.l,sh,vis))+txt(argVal(n.r,sh,vis));
    case"bin":{const a=num(argVal(n.l,sh,vis)),b=num(argVal(n.r,sh,vis));
      if(n.op==="+")return a+b;if(n.op==="-")return a-b;if(n.op==="*")return a*b;
      if(n.op==="^"){const x=a**b;if(!isFinite(x))throw E_NUM;return x;}
      if(b===0)throw E_DIV;return a/b;}
    case"cmp":{let a=argVal(n.l,sh,vis),b=argVal(n.r,sh,vis);
      if(typeof a==="string")a=a.toLowerCase();if(typeof b==="string")b=b.toLowerCase();
      if(a===""&&typeof b==="number")a=0;if(b===""&&typeof a==="number")b=0;
      switch(n.op){case"=":return a==b;case"<>":return a!=b;case"<":return a<b;case">":return a>b;case"<=":return a<=b;case">=":return a>=b;}}
    case"ref":{const{sh:s,c,r}=resolveRef(n.v,sh);return getValue(s,addr(c,r),vis);}
    case"range":throw E_VAL;
    case"call":return callFn(n,sh,vis);
  }
}
function rangeVals(n,sh,vis){
  const A=resolveRef(n.a,sh),B=resolveRef(n.b,A.sh); // "Data!A2:A5" — the end inherits the start's sheet
  if(A.sh!==B.sh)throw"cross-sheet range";
  const out=[];
  for(let r=Math.min(A.r,B.r);r<=Math.max(A.r,B.r);r++){const row=[];
    for(let c=Math.min(A.c,B.c);c<=Math.max(A.c,B.c);c++)row.push(getValue(A.sh,addr(c,r),vis));
    out.push(row);}
  return out;
}
/* ---------- values, errors, coercion ----------
   An error is a plain {err:"#..."} object, raised by throwing it. getValue stores
   whatever comes back, so a cell holding an error hands that same object to anyone
   referencing it and the error travels up the sheet the way Excel's does. */
const E_DIV={err:"#DIV/0!"},E_NA={err:"#N/A"},E_VAL={err:"#VALUE!"},E_NUM={err:"#NUM!"},E_REF={err:"#REF!"};
function isErr(v){return!!v&&typeof v==="object"&&typeof v.err==="string";}
function ck(v){if(isErr(v))throw v;return v;}
function txt(v){
  if(v==null||v==="")return"";
  if(typeof v==="boolean")return v?"TRUE":"FALSE";
  if(typeof v==="number")return String(+v.toFixed(10));
  return String(v);
}
function bool(v){
  if(typeof v==="boolean")return v;
  if(typeof v==="string")return v===""?false:(v.toLowerCase()==="false"?false:(v.toLowerCase()==="true"?true:!!num(v)));
  return!!num(v);
}
function blank(v){return v===""||v==null;}

function argVal(a,sh,vis){return ck(evalNode(a,sh,vis));}
function grid(a,sh,vis){return a.k==="range"?rangeVals(a,sh,vis):[[argVal(a,sh,vis)]];}
function flat(a,sh,vis){return[].concat(...grid(a,sh,vis));}
function flatAll(args,sh,vis){const o=[];for(const a of args)o.push(...flat(a,sh,vis));return o;}
// aggregation: text/blanks inside a range are skipped, a bare argument is coerced
function numsOf(args,sh,vis,from){
  const o=[];
  for(let i=from||0;i<args.length;i++){const a=args[i];
    if(a.k==="range"){for(const v of flat(a,sh,vis)){ck(v);if(!blank(v)&&isNum(v))o.push(num(v));}}
    else{const v=argVal(a,sh,vis);if(!blank(v))o.push(num(v));}}
  return o;
}

/* ---------- criteria ("<=5", "apple", "*ltd") shared by SUMIF/COUNTIF/... ---------- */
function crit(c){
  let op="=",s=c;
  if(typeof c==="string"){const m=/^(<=|>=|<>|=|<|>)([\s\S]*)$/.exec(c.trim());if(m){op=m[1];s=m[2];}}
  const isN=!blank(s)&&isNum(s),sv=isN?num(s):txt(s).toLowerCase();
  const wild=!isN&&/[*?]/.test(sv)&&(op==="="||op==="<>");
  const re=wild?new RegExp("^"+sv.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,"[\\s\\S]*").replace(/\?/g,"[\\s\\S]")+"$"):null;
  return v=>{
    if(isErr(v))return false;
    if(re)return re.test(txt(v).toLowerCase())===(op==="=");
    if(blank(s))return op==="<>"?!blank(v):blank(v);
    let a,b;
    if(isN){if(blank(v)||!isNum(v))return op==="<>";a=num(v);b=sv;}
    else{if(typeof v==="number")return op==="<>";a=txt(v).toLowerCase();b=sv;}
    switch(op){case"=":return a===b;case"<>":return a!==b;case"<":return a<b;
      case"<=":return a<=b;case">":return a>b;default:return a>=b;}
  };
}
// [range,matcher] pairs from argument `from`, and the rows every matcher accepts
function pairsOf(a,sh,vis,from){const p=[];for(let i=from;i+1<a.length;i+=2)p.push([flat(a[i],sh,vis),crit(argVal(a[i+1],sh,vis))]);return p;}
function hits(p,len){const o=[];for(let i=0;i<len;i++){let ok=p.length>0;for(const[r,m]of p){if(!m(r[i])){ok=false;break;}}if(ok)o.push(i);}return o;}

/* ---------- dates ----------
   The model stores dates as text, so these read and write ISO (YYYY-MM-DD);
   D.M.YYYY and M/D/YYYY are also accepted on input. */
function pdate(v){
  if(v instanceof Date)return v;
  const s=txt(v).trim();let m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)))return new Date(+m[1],m[2]-1,+m[3]);
  if((m=/^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})/.exec(s)))return new Date(+m[3],m[2]-1,+m[1]);
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s)))return new Date(+m[3],m[1]-1,+m[2]);
  throw E_VAL;
}
const p2=n=>String(n).padStart(2,"0");
function iso(d){if(isNaN(d))throw E_NUM;return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
const DAYMS=86400000;
function dayDiff(a,b){return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/DAYMS);}

/* --- TEXT(): the handful of format codes people actually type */
function fmtNum(x,f){
  if(/[yd]|mm?m/.test(f)&&/[ymd]/.test(f)){
    const d=pdate(x);
    return f.replace(/yyyy|yy|mmm|mm|m|ddd|dd|d/g,t=>({
      yyyy:d.getFullYear(),yy:p2(d.getFullYear()%100),
      mmm:"JanFebMarAprMayJunJulAugSepOctNovDec".substr(d.getMonth()*3,3),
      mm:p2(d.getMonth()+1),m:d.getMonth()+1,
      ddd:"SunMonTueWedThuFriSat".substr(d.getDay()*3,3),
      dd:p2(d.getDate()),d:d.getDate()}[t]));
  }
  let v=num(x),suf="";
  if(/%/.test(f)){v*=100;suf="%";}
  const dot=f.indexOf("."),dec=dot<0?0:(f.slice(dot+1).match(/[0#]/g)||[]).length;
  let s=Math.abs(v).toFixed(dec);
  if(/,/.test(f)){const[i,d]=s.split(".");s=i.replace(/\B(?=(\d{3})+(?!\d))/g,",")+(d?"."+d:"");}
  return(v<0?"-":"")+s+suf;
}

/* ---------- built-in functions ----------
   Chosen by how often real sheets need them, not to pad the count. Every entry takes
   the one env object built in callFn below; an unknown name raises #NAME?. */
const FNS={
  /* math */
  SUM:E=>E.nums().reduce((a,b)=>a+b,0),
  PRODUCT:E=>{const n=E.nums();return n.length?n.reduce((a,b)=>a*b,1):0;},
  SUMPRODUCT:E=>{const gs=E.a.map((_,i)=>E.flat(i));let s=0;
    for(let i=0;i<gs[0].length;i++){let p=1;for(const g of gs){const v=g[i];ck(v);p*=(blank(v)||!isNum(v))?0:num(v);}s+=p;}return s;},
  ABS:E=>Math.abs(E.n(0)),SIGN:E=>Math.sign(E.n(0)),
  INT:E=>Math.floor(E.n(0)),
  TRUNC:E=>{const f=10**E.n(1,0);return Math.trunc(E.n(0)*f)/f;},
  ROUND:E=>{const f=10**E.n(1,0);return Math.sign(E.n(0))*Math.round((Math.abs(E.n(0))+Number.EPSILON)*f)/f;},
  ROUNDUP:E=>{const f=10**E.n(1,0);return Math.sign(E.n(0))*Math.ceil(Math.abs(E.n(0))*f-1e-9)/f;},
  ROUNDDOWN:E=>{const f=10**E.n(1,0);return Math.sign(E.n(0))*Math.floor(Math.abs(E.n(0))*f+1e-9)/f;},
  CEILING:E=>{const s=E.n(1,1);return s?Math.ceil(E.n(0)/s)*s:0;},
  FLOOR:E=>{const s=E.n(1,1);return s?Math.floor(E.n(0)/s)*s:0;},
  MOD:E=>{const b=E.n(1);if(!b)throw E_DIV;return E.n(0)-b*Math.floor(E.n(0)/b);},
  POWER:E=>E.n(0)**E.n(1),
  SQRT:E=>{const x=E.n(0);if(x<0)throw E_NUM;return Math.sqrt(x);},
  EXP:E=>Math.exp(E.n(0)),
  LN:E=>{const x=E.n(0);if(x<=0)throw E_NUM;return Math.log(x);},
  LOG:E=>Math.log(E.n(0))/Math.log(E.n(1,10)),
  PI:()=>Math.PI,
  /* statistics */
  AVERAGE:E=>{const n=E.nums();if(!n.length)throw E_DIV;return n.reduce((a,b)=>a+b,0)/n.length;},
  MEDIAN:E=>{const n=E.nums().sort((a,b)=>a-b);if(!n.length)throw E_NUM;
    const h=n.length>>1;return n.length%2?n[h]:(n[h-1]+n[h])/2;},
  MIN:E=>{const n=E.nums();return n.length?Math.min(...n):0;},
  MAX:E=>{const n=E.nums();return n.length?Math.max(...n):0;},
  COUNT:E=>E.nums().length,
  COUNTA:E=>E.all().filter(v=>!blank(v)).length,
  COUNTBLANK:E=>E.all().filter(blank).length,
  LARGE:E=>{const n=E.flat(0).filter(v=>!blank(v)&&isNum(ck(v))).map(num).sort((a,b)=>b-a),k=E.n(1);
    if(k<1||k>n.length)throw E_NUM;return n[k-1];},
  SMALL:E=>{const n=E.flat(0).filter(v=>!blank(v)&&isNum(ck(v))).map(num).sort((a,b)=>a-b),k=E.n(1);
    if(k<1||k>n.length)throw E_NUM;return n[k-1];},
  STDEV:E=>stdev(E.nums(),1),"STDEV.S":E=>stdev(E.nums(),1),
  STDEVP:E=>stdev(E.nums(),0),"STDEV.P":E=>stdev(E.nums(),0),
  /* logic */
  IF:E=>{const c=E.v(0);return(typeof c==="string"?c!=="":bool(c))?E.v(1):(E.a[2]!==undefined?E.v(2):false);},
  IFS:E=>{for(let i=0;i+1<E.a.length;i+=2)if(bool(E.v(i)))return E.v(i+1);throw E_NA;},
  SWITCH:E=>{const k=txt(E.v(0)).toLowerCase();
    for(let i=1;i+1<E.a.length;i+=2)if(txt(E.v(i)).toLowerCase()===k)return E.v(i+1);
    return E.a.length%2===0?E.v(E.a.length-1):(()=>{throw E_NA;})();},
  IFERROR:E=>{try{const v=E.raw(0);return isErr(v)?E.v(1):v;}catch(e){return E.v(1);}},
  IFNA:E=>{try{const v=E.raw(0);return isErr(v)&&v.err==="#N/A"?E.v(1):ck(v);}
    catch(e){if(isErr(e)&&e.err==="#N/A")return E.v(1);throw e;}},
  AND:E=>E.all().every(v=>blank(v)?true:bool(ck(v))),
  OR:E=>E.all().some(v=>blank(v)?false:bool(ck(v))),
  NOT:E=>!bool(E.v(0)),
  TRUE:()=>true,FALSE:()=>false,NA:()=>{throw E_NA;},
  /* conditional aggregation */
  SUMIF:E=>condAgg(E,"sum",1,E.a[2]?2:0),
  SUMIFS:E=>condAgg(E,"sum",1,0,true),
  AVERAGEIF:E=>condAgg(E,"avg",1,E.a[2]?2:0),
  AVERAGEIFS:E=>condAgg(E,"avg",1,0,true),
  MAXIFS:E=>condAgg(E,"max",1,0,true),
  MINIFS:E=>condAgg(E,"min",1,0,true),
  COUNTIF:E=>hits(pairsOf(E.a,E.sh,E.vis,0),E.flat(0).length).length,
  COUNTIFS:E=>hits(pairsOf(E.a,E.sh,E.vis,0),E.flat(0).length).length,
  /* lookup */
  VLOOKUP:E=>lookup2d(E,false),
  HLOOKUP:E=>lookup2d(E,true),
  MATCH:E=>{const arr=E.flat(1),k=E.v(0),t=E.n(2,1);
    if(!t){const i=arr.findIndex(v=>same(v,k));if(i<0)throw E_NA;return i+1;}
    let best=-1;
    for(let i=0;i<arr.length;i++){const v=arr[i];if(blank(v))continue;
      const d=cmpv(v,k);if(t>0?d<=0:d>=0)best=i;else if(t>0?d>0:d<0)break;}
    if(best<0)throw E_NA;return best+1;},
  INDEX:E=>{const g=E.grid(0),r=E.n(1,1);
    let ri=r,ci=E.n(2,g.length===1&&E.a[2]===undefined?0:1);
    if(g.length===1&&E.a[2]===undefined){ri=1;ci=r;}
    else if(g[0].length===1&&E.a[2]===undefined)ci=1;
    if(ri<1||ri>g.length||ci<1||ci>g[0].length)throw E_REF;
    return ck(g[ri-1][ci-1]);},

const SIG=new Map(FNSIG.split("\n").map(l=>{const[n,a,d]=l.split("|");return[n,{p:a?a.split(","):[],d}];}));

function mdays(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
function stdev(n,ddof){if(n.length<=ddof)throw E_DIV;
  const m=n.reduce((a,b)=>a+b,0)/n.length;
  return Math.sqrt(n.reduce((s,x)=>s+(x-m)**2,0)/(n.length-ddof));}

function condAgg(E,kind,critFrom,targetIdx,targetFirst){
  const a=E.a,pairs=pairsOf(a,E.sh,E.vis,targetFirst?1:critFrom-1);
  const tgt=E.flat(targetFirst?0:targetIdx);

  const n=[];
  for(const i of hits(pairs,probe.length)){const v=tgt[i];ck(v);if(!blank(v)&&isNum(v))n.push(num(v));}
  if(kind==="sum")return n.reduce((x,y)=>x+y,0);
  if(!n.length)throw kind==="avg"?E_DIV:E_NUM;
  if(kind==="avg")return n.reduce((x,y)=>x+y,0)/n.length;

// lookups compare case-insensitively, and numeric text compares as a number

function cmpv(a,b){const x=key(a),y=key(b);return x<y?-1:x>y?1:0;}

  const k=E.v(0),g=E.grid(1),idx=E.n(2),approx=E.b(3,false);

    if(cmpv(v,k)<=0)at=i;else break;}}
  else at=line.findIndex(v=>same(v,k));

  const row=horiz?g[idx-1]:g[at];
  if(!row)throw E_REF;
  const cell=horiz?row[at]:row[idx-1];

// ROW()/COLUMN() with no argument mean the cell being evaluated
function refOf(E,i){
  const a=E.a[i];

  if(a.k==="ref")return resolveRef(a.v,E.sh);

function callFn(n,sh,vis){
  const f=FNS[n.fn];

  const a=n.args;
  const E={a,sh,vis,
    raw:i=>evalNode(a[i],sh,vis),
    v:i=>argVal(a[i],sh,vis),
    n:(i,d)=>a[i]===undefined?d:num(argVal(a[i],sh,vis)),
    s:(i,d)=>a[i]===undefined?(d===undefined?"":d):txt(argVal(a[i],sh,vis)),
    b:(i,d)=>a[i]===undefined?d:bool(argVal(a[i],sh,vis)),

    flat:i=>flat(a[i],sh,vis),
    all:()=>flatAll(a,sh,vis),

}

// the cell currently being evaluated, so ROW()/COLUMN() can answer without an argument
let CURCELL=null;
function addrPos(sh,a){const m=REF.exec(a);return{sh,c:colIdx(m[3]),r:parseInt(m[5])-1};}
const evalCache=new Map();
function getValue(sh,a,vis){
  const key=sh.name+"!"+a;
  if(evalCache.has(key))return evalCache.get(key);
  const c=cell(sh,a);
  let v="";
  if(c&&c.v!=null&&c.v!==""){
    const raw=String(c.v);
    if(raw[0]==="="){
      if(vis.has(key))throw"circular";
      vis.add(key);
      const prev=CURCELL;CURCELL=addrPos(sh,a);
      try{v=evalNode(parse(tokenize(raw.slice(1))),sh,vis);}
      catch(e){v=isErr(e)?e:{err:String(e)};}
      CURCELL=prev;vis.delete(key);

      const t=c.f&&c.f.type;
      if(t==="text")v=raw;

function displayValue(sh,a,fOverride){
  const v=getValue(sh,a,new Set());
  const c=fOverride?{f:fOverride}:cell(sh,a);
  if(isErr(v))return{text:v.err[0]==="#"?v.err:"#ERR",err:true,title:v.err};
  if(typeof v==="boolean")return{text:v?"TRUE":"FALSE"};
  if(typeof v==="number"){
    const d=c&&c.f&&c.f.dec!=null?c.f.dec:null;
    return{text:d==null?String(+v.toFixed(10)):v.toFixed(d),num:true};
  }
  return{text:String(v)};
}

/* ---------- reference shifting for fill/drag ---------- */
function shiftFormula(src,dc,dr){
  // replace refs, respecting $ locks; leave sheet-qualified column/row shifts identical
  return src.replace(/(?:([A-Za-z_][A-Za-z0-9_ ]*)!)?(\$?)([A-Z]+)(\$?)(\d+)/g,(m,shn,dl,col,dlr,row,off,whole)=>{
    // skip if part of a longer word (e.g. function name) — heuristic: preceded by letter handled by regex boundaries
    let c=colIdx(col),r=parseInt(row)-1;
    if(!dl)c+=dc;if(!dlr)r+=dr;
    if(c<0||r<0)return"#REF";
    return(shn?shn+"!":"")+dl+colName(c)+dlr+(r+1);
  });
}

/* ---------- rendering ---------- */
const gridpos=$("gridpos");

function buildGrid(){

    ()=>{COLS=Math.min(XL_MAXCOL,COLS+10);}));

  fillHandle=document.createElement("div");fillHandle.id="fill";fillHandle.style.display="none";
  fillHandle.addEventListener("mousedown",fillHandleDown); // the handle is rebuilt with the grid
  gridpos.appendChild(fillHandle);

  grow.id="grow";
  grow.appendChild(growBtn("morerows","+100 rows",ROWS>=XL_MAXROW,

// pin the table to the sum of its column widths so the window size can never rescale it
function sizeTable(){

/* ---------- conditional formatting ---------- */
// rule: {range:"B1:M100", test:"K", op, v1, v2, lo, hi, fmt:"A1"}
//   range: cells the formatting paints

//   op   : "==" "!=" ">" ">=" "<" "<=" "between" "in"

const cfCache={byCol:null,sets:new Map(),fmts:new Map(),tests:new Map()};

// "K" -> that column, same row as the painted cell; "K2" -> that one cell; "" -> the cell itself
function cfTestRef(sh,test){
  if(cfCache.tests.has(test))return cfCache.tests.get(test);
  let out=null;
  const t=(test||"").trim();
  if(t){
    const m=t.match(/^(?:([A-Za-z_][A-Za-z0-9_ ]*)!)?\$?([A-Za-z]+)\$?(\d+)?$/);
    if(m){
      const tsh=m[1]?sheetByName(m[1].trim()):sh;
      if(tsh)out=m[3]?{sh:tsh,c:colIdx(m[2]),r:+m[3]-1}:{sh:tsh,c:colIdx(m[2])};

// resolve "A1:B9" (optionally sheet-qualified) to bounds, or null
function cfBounds(sh,ref){

    if(n.k!=="range")return null;

// rules that apply to `sh`, bucketed by column so an unaffected cell costs one lookup

// compare the way the formula engine sees values, so 5 and "5" match but "11,22" stays text

function cfCmp(a,b){

  if(na)return num(a)-num(b);

}

    ssh=t.sh;src=addr(t.c,t.r!=null?t.r:row); // no row in the ref means "same row"
  }

  try{v=getValue(ssh,src,new Set());}catch(e){return false;}
  if(v===""||v==null||typeof v==="object")return false;
  switch(rule.op){
    case "in":{const set=cfSet(sh,rule);return!!set&&set.has(cfKey(v));}
    case "!=":return cfKey(v)!==cfKey(rule.v1);
    case "between":
      return cfTest(rule.lo||">",v,rule.v1)&&cfTest(rule.hi||"<=",v,rule.v2);

// effective formatting: a matching rule OVERRIDES the cell's own colors/decimals.

    if(!cfMatch(sh,a,rule,row))continue;

function paintCell(td,sh){

/* ---------- editing ---------- */
let editor=$("editor");
let editing=false;
function startEdit(initial){
  pick=null;
  const sh=sheet(),a=addr(sel.c,sel.r),c=cell(sh,a);
  const td=tdAt(sel.c,sel.r),rect=td.getBoundingClientRect(),host=gridpos.getBoundingClientRect();
  let el;
  if(c&&c.f&&c.f.dv&&initial==null){
    el=document.createElement("select");el.id="editor";
    try{
      const t=tokenize(c.f.dv);const n=parse(t);
      if(n.k!=="range")throw 0;
      const A=resolveRef(n.a,sh),B=resolveRef(n.b,A.sh); // "Data!A2:A5" — the end inherits the start's sheet
      el.append(new Option("",""));
      // the source may run down a column, across a row, or fill a block — read it row by row
      for(let r=Math.min(A.r,B.r);r<=Math.max(A.r,B.r);r++)
      for(let c=Math.min(A.c,B.c);c<=Math.max(A.c,B.c);c++){
        const srcA=addr(c,r),v=String(getValue(A.sh,srcA,new Set()));
        if(v==="")continue;
        const o=new Option(v,v);
        o.dataset.bg=(cell(A.sh,srcA)&&cell(A.sh,srcA).f&&cell(A.sh,srcA).f.bg)||"";
        el.append(o);
      }
    }catch(e){alert("Bad dropdown source range: "+c.f.dv);return;}

  }else{
    el=document.createElement("input");el.id="editor";el.spellcheck=false;
    el.value=initial!=null?initial:(c&&c.v!=null?c.v:"");
  }
  if(editor)editor.remove();
  editor=el;
  el.style.cssText=`display:block;position:absolute;left:${rect.left-host.left-1}px;top:${rect.top-host.top-1}px;width:${rect.width+2}px;height:${rect.height+2}px;`;
  gridpos.appendChild(el);
  el.focus();
  if(el.tagName==="INPUT"&&initial==null)el.select();
  if(el.tagName==="SELECT")try{el.showPicker&&el.showPicker();}catch(err){}
  editing=true;
  paintRefs();
  faAttach(el); // before the commit handler below: the popup gets first refusal on Enter/Tab
  el.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"){ev.preventDefault();commitEdit(el.value);move(0,1);}
    else if(ev.key==="Tab"){ev.preventDefault();commitEdit(el.value);move(1,0);}
    else if(ev.key==="Escape"){cancelEdit();}
  });
  el.addEventListener("input",()=>{pick=null;paintRefs();});
  el.addEventListener("click",()=>{pick=null;});

}
function curEditor(){return editor;}
function commitEdit(val,bg){
  if(!editing)return;editing=false;
  const sh=sheet(),a=addr(sel.c,sel.r);

  else{const c=ensure(sh,a);c.v=val;if(bg!==undefined&&bg!==""){(c.f=c.f||{}).bg=bg;}else if(bg===""&&c.f&&c.f.dv){c.f.bg="";}}

function hideEditor(){

// hand keyboard focus back to the grid, unless the user just clicked into another control
function focusGrid(force){

/* ---------- formula reference picking ---------- */
let pick=null; // {start,end} span of the ref last inserted by clicking

//   dropdown source field -> it holds exactly one range, so replace the whole value
function refTarget(){

  const fi=$("finput");

function rangeRef(a,b){

function qualifiedRef(a,b){return sheet().name+"!"+rangeRef(a,b);}
function putRef(el,text){
  // first pick of a drag starts at the caret; later ones overwrite the previous ref

  el.value=el.value.slice(0,pick.start)+text+el.value.slice(pick.end);

const REF_RE=/(?<![A-Za-z0-9_$!])(?:([A-Za-z_][A-Za-z0-9_ ]*)!)?(\$?)([A-Za-z]+)(\$?)(\d+)(?:\s*:\s*(\$?)([A-Za-z]+)(\$?)(\d+))?(?![A-Za-z0-9_(])/g;
function clearRefs(){

    td.classList.remove("ref","ref0","ref1","ref2","ref3","ref4");

// highlight every cell the formula being edited refers to, one colour per distinct ref
function paintRefs(){
  clearRefs();

  if(!el)return;
  const seen=new Map();
  for(const m of el.value.matchAll(REF_RE)){
    const[,shn,,c1,,r1,,c2,,r2]=m;
    if(shn&&shn.trim().toLowerCase()!==sheet().name.toLowerCase())continue; // other sheet: not on screen
    const key=m[0].toUpperCase();
    if(!seen.has(key))seen.set(key,seen.size%5);
    const cls=seen.get(key);
    const a={c:colIdx(c1),r:+r1-1},b=c2?{c:colIdx(c2),r:+r2-1}:a;
    for(let r=Math.min(a.r,b.r);r<=Math.max(a.r,b.r);r++){
      if(r<0||r>=ROWS)continue;
      for(let c=Math.min(a.c,b.c);c<=Math.max(a.c,b.c);c++){

/* ---------- formula autocomplete ----------
   One popup serves both halves of the job: while a function name is being typed it
   lists the matches, and once inside the brackets it shows the signature with the
   argument under the caret highlighted. Driven purely off the caret position, so it
   also follows clicks and arrow keys, not just typing. */
const fapop=$("fapop");
const FNAMES=Object.keys(FNS).sort();
let faList=[],faIdx=0,faCall=null,faTook=false;

// Walk "=..." up to the caret and report what the caret is sitting in:
// the identifier being typed, and the innermost call plus which argument we are on.
function faCtx(text,caret){
  if(!text.trimStart().startsWith("="))return null;
  const s=text.slice(0,caret);
  const stack=[];let name="",q=false;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(q){if(ch==='"')q=false;continue;}
    if(ch==='"'){q=true;name="";}
    else if(/[A-Za-z0-9_.]/.test(ch))name+=ch;
    else if(ch==="("){stack.push({n:name.toUpperCase(),a:0});name="";}
    else if(ch===")"){stack.pop();name="";}
    else if(ch===","||ch===";"){if(stack.length)stack[stack.length-1].a++;name="";}
    else name="";
  }
  return{prefix:name.toUpperCase(),call:stack.length?stack[stack.length-1]:null};
}

function faHide(){fapop.hidden=true;fapop.innerHTML="";faList=[];faCall=null;}

function faUpdate(el){
  if(!el||!el.isConnected){faHide();return;}
  const ctx=faCtx(el.value,el.selectionStart==null?el.value.length:el.selectionStart);
  if(!ctx){faHide();return;}
  const was=faList.join(",");
  // shortest match first, so "SU" offers SUM ahead of SUBSTITUTE
  faList=ctx.prefix?FNAMES.filter(n=>n.startsWith(ctx.prefix)).sort((a,b)=>a.length-b.length||(a<b?-1:1)):[];
  faCall=ctx.call&&SIG.has(ctx.call.n)?ctx.call:null;
  if(!faList.length&&!faCall){faHide();return;}
  // hold the highlight while the same candidates stand; a changed list re-ranks from the top
  faIdx=faList.join(",")===was?faIdx:0;
  faPaint(el);
}

function faSpan(cls,text){const e=document.createElement("span");e.className=cls;e.textContent=text;return e;}

function faPaint(el){
  fapop.innerHTML="";
  if(faList.length)faPaintList(el);
  else faPaintSig();
  fapop.hidden=false;
  // under the field, flipped above it when there is no room below
  const r=el.getBoundingClientRect(),w=fapop.offsetWidth,h=fapop.offsetHeight;
  let L=r.left,T=r.bottom+2;
  if(L+w>innerWidth-6)L=Math.max(6,innerWidth-6-w);
  if(T+h>innerHeight-6&&r.top-4-h>0)T=r.top-2-h;
  fapop.style.left=L+"px";fapop.style.top=T+"px";
  const on=fapop.querySelector("li.on");
  if(on)on.scrollIntoView({block:"nearest"});
}

function faPaintList(el){
  const ul=document.createElement("ul");
  faList.forEach((n,i)=>{
    const li=document.createElement("li"),s=SIG.get(n);
    if(i===faIdx)li.className="on";
    li.append(faSpan("nm mono",n),faSpan("ar mono","("+(s?s.p.join(", "):"…")+")"),faSpan("ds",s?s.d:""));
    // mousedown, not click: the field must not lose focus before we edit it
    li.addEventListener("mousedown",ev=>{ev.preventDefault();faIdx=i;faAccept(el);});
    ul.append(li);
  });

}

function faPaintSig(){
  const s=SIG.get(faCall.n),d=document.createElement("div");
  d.className="sig mono";
  d.append(faCall.n+"(");
  s.p.forEach((p,i)=>{
    if(i)d.append(", ");
    const last=i===s.p.length-1;
    // a trailing "…" keeps the highlight while further arguments are typed
    if(i===faCall.a||(last&&faCall.a>i&&/…$/.test(p))){
      const b=document.createElement("b");b.textContent=p;d.append(b);
    }else d.append(p);
  });

  fapop.append(d);

    fapop.append(f);
  }

// replace the half-typed name with the chosen one and open its bracket
function faAccept(el){
  const n=faList[faIdx];if(!n)return;
  const car=el.selectionStart==null?el.value.length:el.selectionStart;
  const ctx=faCtx(el.value,car);
  const st=car-(ctx?ctx.prefix.length:0),rest=el.value.slice(car);
  const s=SIG.get(n),open=rest.startsWith("(")?"":(s&&!s.p.length?"()":"(");
  el.value=el.value.slice(0,st)+n+open+rest;
  const cp=st+n.length+(rest.startsWith("(")?1:open.length);

function faKey(e){
  if(fapop.hidden)return;
  const el=e.currentTarget;
  const stop=()=>{e.preventDefault();e.stopImmediatePropagation();faTook=true;};
  if(e.key==="Escape"){faHide();stop();}           // first Escape drops the hint, second cancels the edit
  else if(!faList.length)return;                    // signature only: every key belongs to the editor
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    faIdx=(faIdx+(e.key==="ArrowDown"?1:faList.length-1))%faList.length;faPaint(el);stop();
  }
  else if(e.key==="Enter"||e.key==="Tab"){faAccept(el);stop();}

// keyup catches caret moves (arrows, Home/End) that fire no input event
function faAttach(el){
  el.addEventListener("keydown",faKey);

  el.addEventListener("input",u);
  el.addEventListener("click",u);
  // ...but a key the popup just acted on is not a caret move: refreshing would undo it
  el.addEventListener("keyup",()=>{if(faTook)faTook=false;else faUpdate(el);});
  el.addEventListener("blur",faHide);
}
faAttach($("finput")); // registered here, above the formula bar's own Enter handler

/* ---------- clipboard ---------- */
let clip=null; // {w,h,cells,origin:{c,r},cut:boolean,sheet:index}
function selRect(){
  const e=selEnd||sel;
  return{c1:Math.min(sel.c,e.c),c2:Math.max(sel.c,e.c),r1:Math.min(sel.r,e.r),r2:Math.max(sel.r,e.r)};
}
// run fn over every cell in the selection, creating cells as needed
function eachSelected(fn){
  const R=selRect(),sh=sheet();
  for(let r=R.r1;r<=R.r2;r++)for(let c=R.c1;c<=R.c2;c++)fn(ensure(sh,addr(c,r)));

/* ---------- colour palette ---------- */
// muted, print-friendly hues: slate, red, orange, gold, green, teal, blue, indigo, purple, brown
const TEXT_COLORS=["#37474f","#b04b45","#b56a2e","#8f7419","#4b8b4a","#3a8a86","#3a6ea8","#4f5fa8","#7a4f96","#8a5c46"];
const FILL_COLORS=["#eceff1","#f7e3e0","#fbe9d8","#f8f0cf","#e3f0e0","#dcefee","#dfe9f5","#e4e6f5","#ede2f2","#efe4de"];

// bold is a toggle over the whole selection: it turns off only when every cell is
// already bold, so a mixed selection bolds the rest rather than clearing the lot
function selAllBold(){
  const R=selRect(),sh=sheet();
  for(let r=R.r1;r<=R.r2;r++)for(let c=R.c1;c<=R.c2;c++){
    const x=cell(sh,addr(c,r));
    if(!(x&&x.f&&x.f.bold))return false;
  }
  return true;
}
function toggleBold(){
  const on=!selAllBold();
  eachSelected(c=>{c.f=c.f||{};if(on)c.f.bold=true;else delete c.f.bold;});
  syncBold();
}
function syncBold(){$("boldBtn").setAttribute("aria-pressed",selAllBold()?"true":"false");}
const applyBg=v=>eachSelected(c=>{c.f=c.f||{};if(v==="")delete c.f.bg;else c.f.bg=v;});
const cpop=$("cpop");
let cpopOwner=null;
function closeCpop(){
  if(!cpopOwner)return;
  // park the native picker back out of the way so it survives the next open
  const inp=cpop.querySelector("input[type=color]");
  if(inp)$("cinputs").appendChild(inp);
  cpop.hidden=true;cpop.innerHTML="";cpopOwner=null;
}
function openCpop(btn,colors,apply,input,dot){
  if(cpopOwner===btn){closeCpop();return;}
  closeCpop();
  cpopOwner=btn;
  const none=document.createElement("button");
  none.className="none";none.textContent="Default";
  none.onclick=()=>{apply("");dot.style.background="#fff";closeCpop();};
  cpop.appendChild(none);
  const grid=document.createElement("div");grid.className="grid";
  for(const col of colors){
    const b=document.createElement("button");
    b.className="sw";b.style.background=col;b.title=col;
    b.onclick=()=>{apply(col);dot.style.background=col;closeCpop();};
    grid.appendChild(b);
  }
  cpop.appendChild(grid);
  const row=document.createElement("div");row.className="row";
  row.append(document.createTextNode("Custom"));row.appendChild(input);
  cpop.appendChild(row);
  cpop.hidden=false;
  const r=btn.getBoundingClientRect();
  cpop.style.left=Math.round(window.scrollX+r.left)+"px";
  cpop.style.top=Math.round(window.scrollY+r.bottom+4)+"px";
}

/* ---------- borders ----------
   f.b is a 4-bit mask of the cell's own black edges: 1=top 2=right 4=bottom 8=left.
   Each edge is written on BOTH cells that share it, so border-collapse never has to
   pick a winner between a black edge and the default grid line. */
const BD_TOP=1,BD_RIGHT=2,BD_BOTTOM=4,BD_LEFT=8;
const BD_OPP={1:4,4:1,2:8,8:2},BD_STEP={1:[0,-1],4:[0,1],2:[1,0],8:[-1,0]};
function setEdge(sh,c,r,bit,on){
  if(c<0||r<0||c>=COLS||r>=ROWS)return;
  const a=addr(c,r),cur=cell(sh,a);
  if(!on&&!(cur&&cur.f&&cur.f.b))return;   // nothing to clear — don't create a cell
  const cl=on?ensure(sh,a):cur,f=on?(cl.f=cl.f||{}):cl.f;
  const b=on?((f.b|0)|bit):((f.b|0)&~bit);
  if(b)f.b=b;else delete f.b;
  if(b)return;
  if(!Object.keys(f).length)delete cl.f;              // don't leave an empty format behind
  if(cl.v===undefined&&!cl.f)delete sh.cells[a];      // ...or an empty cell
}
// write an edge on the cell and the matching edge on its neighbour, keeping the pair in sync
function setEdgePair(sh,c,r,bit,on){
  setEdge(sh,c,r,bit,on);
  const[dc,dr]=BD_STEP[bit];
  setEdge(sh,c+dc,r+dr,BD_OPP[bit],on);
}
function applyBorder(on){
  const R=selRect(),sh=sheet();
  for(let c=R.c1;c<=R.c2;c++){setEdgePair(sh,c,R.r1,BD_TOP,on);setEdgePair(sh,c,R.r2,BD_BOTTOM,on);}
  for(let r=R.r1;r<=R.r2;r++){setEdgePair(sh,R.c1,r,BD_LEFT,on);setEdgePair(sh,R.c2,r,BD_RIGHT,on);}
  paintAll();save();
  focusGrid(true);   // don't leave the button holding focus after a click
}
// only touch style when the cell has or had a border, so the common case stays free
function paintBorders(td,b){
  if(!b&&!td.dataset.b)return;
  const st=td.style;
  st.borderTopColor=b&BD_TOP?"#000":"";
  st.borderRightColor=b&BD_RIGHT?"#000":"";
  st.borderBottomColor=b&BD_BOTTOM?"#000":"";
  st.borderLeftColor=b&BD_LEFT?"#000":"";
  if(b)td.dataset.b="1";else delete td.dataset.b;
}
// a cell counts as numeric when its evaluated value is a number — decimals only apply there
function isNumericCell(sh,a){
  const c=cell(sh,a);if(!c)return false;
  return typeof getValue(sh,a,new Set())==="number";
}
// first numeric cell in the selection, so the decimals box has something to show
function firstNumeric(){
  const R=selRect(),sh=sheet();
  for(let r=R.r1;r<=R.r2;r++)for(let c=R.c1;c<=R.c2;c++){
    const a=addr(c,r);if(isNumericCell(sh,a))return cell(sh,a);
  }
  return null;
}
function eachNumeric(fn){
  const R=selRect(),sh=sheet();
  for(let r=R.r1;r<=R.r2;r++)for(let c=R.c1;c<=R.c2;c++){
    const a=addr(c,r);if(isNumericCell(sh,a))fn(ensure(sh,a));
  }
  paintAll();save();
}
function paintClip(){
  // the partial pastes are only meaningful right after a copy — a cut has to move everything
  for(const id of["pasteAll","pasteVals","pasteFmt"])$(id).disabled=!(clip&&!clip.cut);
  if(!table)return;
  for(const td of table.querySelectorAll("td.clip"))td.classList.remove("clip");
  if(!clip||clip.sheet!==wb.active)return;
  for(let r=clip.origin.r;r<clip.origin.r+clip.h;r++)
    for(let c=clip.origin.c;c<clip.origin.c+clip.w;c++)
      if(r<ROWS&&c<COLS)tdAt(c,r).classList.add("clip");
}
// Borders belong to the grid position, not to the cell's contents: they never ride along
// with a copy, and a paste leaves whatever the destination already had in place.
function takeBorder(sh,a){const c=cell(sh,a);return c&&c.f?c.f.b|0:0;}
function putBorder(sh,a,b){if(b)(ensure(sh,a).f??={}).b=b;}
function stripBorder(o){
  if(o&&o.f){delete o.f.b;if(!Object.keys(o.f).length)delete o.f;}
  return o;
}
function copySel(cut){
  const R=selRect(),sh=sheet(),cells=[],vals=[],lines=[];
  for(let r=R.r1;r<=R.r2;r++){
    const row=[],text=[],raw=[];
    for(let c=R.c1;c<=R.c2;c++){
      const a=addr(c,r),o=cell(sh,a);
      row.push(o?stripBorder(JSON.parse(JSON.stringify(o))):null);
      text.push(displayValue(sh,a).text);
      let v="";try{v=getValue(sh,a,new Set());}catch(err){v="";}
      raw.push(v&&typeof v==="object"?"":typeof v==="boolean"?(v?"TRUE":"FALSE"):String(v));
    }
    cells.push(row);vals.push(raw);lines.push(text.join("\t"));
  }
  clip={w:R.c2-R.c1+1,h:R.r2-R.r1+1,cells,vals,origin:{c:R.c1,r:R.r1},cut:!!cut,sheet:wb.active};
  paintClip();
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(lines.join("\n")).catch(()=>{});
}
// mode: "all" replaces the cell, "formulas" keeps the destination's formatting,
// "format" keeps the destination's contents. Borders are never part of any of them.
function writeCell(sh,c,r,src,dc,dr,mode){
  const a=addr(c,r),b=takeBorder(sh,a),keep=cell(sh,a);
  const o=src?stripBorder(JSON.parse(JSON.stringify(src))):null;
  if(o&&typeof o.v==="string"&&o.v[0]==="="&&(dc||dr))o.v=shiftFormula(o.v,dc,dr);
  if(mode==="formulas"){
    const f=keep&&keep.f?keep.f:null;                   // destination's own formatting survives
    if(o&&o.v!==undefined){sh.cells[a]={v:o.v};if(f)sh.cells[a].f=f;}
    else if(f)sh.cells[a]={f};
    else delete sh.cells[a];
  }else if(mode==="format"){
    const v=keep?keep.v:undefined;                      // destination's own contents survive
    const f=o&&o.f?o.f:null;
    if(f||v!==undefined){sh.cells[a]={};if(v!==undefined)sh.cells[a].v=v;if(f)sh.cells[a].f=f;}
    else delete sh.cells[a];
  }else{
    if(o)sh.cells[a]=o;else delete sh.cells[a];
  }
  putBorder(sh,a,b);
}
function pasteInternal(mode){
  const sh=sheet(),R=selRect();
  // paste the block at the anchor; if the target range is larger, tile the block across it
  const w=Math.max(clip.w,R.c2-R.c1+1),h=Math.max(clip.h,R.r2-R.r1+1);
  for(let dr=0;dr<h;dr++)for(let dc=0;dc<w;dc++){
    const c=R.c1+dc,r=R.r1+dr;
    if(c>=COLS||r>=ROWS)continue;
    const j=dc%clip.w,i=dr%clip.h;
    if(mode==="values"){
      const t=clip.vals[i][j],a=addr(c,r),b=takeBorder(sh,a);
      if(t==="")delete sh.cells[a];else sh.cells[a]={v:t};
      putBorder(sh,a,b);
    }else{
      writeCell(sh,c,r,clip.cells[i][j],c-(clip.origin.c+j),r-(clip.origin.r+i),mode);
    }
  }
  if(clip.cut){
    if(clip.sheet===wb.active){
      const csh=wb.sheets[clip.sheet];
      for(let r=clip.origin.r;r<clip.origin.r+clip.h;r++)
        for(let c=clip.origin.c;c<clip.origin.c+clip.w;c++){
          const a=addr(c,r);
          // don't wipe cells the paste just wrote
          if(c>=R.c1&&c<R.c1+w&&r>=R.r1&&r<R.r1+h)continue;
          const b=takeBorder(csh,a);
          delete csh.cells[a];
          putBorder(csh,a,b);
        }
    }
  }
  // A single copied cell stays on the clipboard so it can be stamped repeatedly —
  // the marching ants keep showing where it came from, and Escape puts it away.
  // A copied range is consumed by its first paste, and so is any cut, which would
  // otherwise duplicate the cells it was supposed to move.
  if(clip.cut||clip.w!==1||clip.h!==1)clip=null;
  paintAll();paintClip();save();
}
function pasteText(txt){
  const sh=sheet(),R=selRect(),rows=txt.replace(/\r/g,"").replace(/\n$/,"").split("\n").map(l=>l.split("\t"));
  for(let i=0;i<rows.length;i++)for(let j=0;j<rows[i].length;j++){
    const c=R.c1+j,r=R.r1+i;
    if(c>=COLS||r>=ROWS)continue;
    const v=rows[i][j],a=addr(c,r),b=takeBorder(sh,a);
    if(v==="")delete sh.cells[a];else ensure(sh,a).v=v;
    putBorder(sh,a,b);
  }
  paintAll();save();
}
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey))return;
  const k=e.key.toLowerCase();
  // Ctrl+S works while editing too: it must always beat the browser's page-save dialog
  if(k==="s"){
    e.preventDefault();
    if(!canSaveInPlace()){downloadHtml();return;}
    savetip("Saving\u2026");
    saveInPlace().then(n=>savetip("Saved to "+n)).catch(err=>{
      $("savetip").style.display="none";
      if(err.name!=="AbortError")alert("Could not save the file: "+err.message);
    });
    return;
  }
  if(editing||e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.isContentEditable)return;
  if(k==="z"){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
  if(k==="y"){e.preventDefault();redo();return;}
  if(k==="b"){e.preventDefault();toggleBold();return;}
  if(k==="c"||k==="x"){copySel(k==="x");e.preventDefault();}
  else if(k==="v"){
    e.preventDefault();
    if(clip){pasteInternal(e.shiftKey?"values":"all");return;}
    if(navigator.clipboard&&navigator.clipboard.readText)
      navigator.clipboard.readText().then(t=>{if(t)pasteText(t);}).catch(()=>{});
  }
});
// paste event covers browsers that block async clipboard reads
document.addEventListener("paste",e=>{
  if(editing||e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.isContentEditable)return;
  if(clip)return; // internal clipboard already handled by keydown
  const t=e.clipboardData&&e.clipboardData.getData("text/plain");
  if(t){e.preventDefault();pasteText(t);}
});

/* ---------- header selection & sizing ---------- */
// selecting a whole column means spanning every row (and vice versa) — that's what
// paintHeaders() and axisSel() both look for, so the rc buttons light up for free
function selectBand(isCol,a,b){
  if(isCol){sel={c:Math.min(a,b),r:0};selEnd={c:Math.max(a,b),r:ROWS-1};}
  else{sel={c:0,r:Math.min(a,b)};selEnd={c:COLS-1,r:Math.max(a,b)};}
  paintSelection();
}
$("gridwrap").addEventListener("mousedown",e=>{
  if(e.target.classList.contains("rsz-c")||e.target.classList.contains("rsz-r"))return; // the resizer owns this
  const th=e.target.closest("th");
  if(!th||refTarget())return;              // formula ref picking works on cells only
  e.preventDefault();focusGrid(true);
  const cs=th.dataset.c,rs=th.dataset.r;
  if(cs===undefined&&rs===undefined){      // the corner cell selects the whole sheet
    sel={c:0,r:0};selEnd={c:COLS-1,r:ROWS-1};paintSelection();return;
  }
  const isCol=cs!==undefined,start=+(isCol?cs:rs);
  const from=e.shiftKey?(isCol?sel.c:sel.r):start;   // shift-click extends from the anchor
  selectBand(isCol,from,start);
  const mm=ev=>{
    const t=ev.target.closest&&ev.target.closest("th");
    if(!t)return;
    const v=isCol?t.dataset.c:t.dataset.r;
    if(v!==undefined)selectBand(isCol,from,+v);
  };
  const mu=()=>{removeEventListener("mousemove",mm);removeEventListener("mouseup",mu);};
  addEventListener("mousemove",mm);addEventListener("mouseup",mu);
});
// column / row resizing, driven by the .rsz-c / .rsz-r handles inside each header
document.addEventListener("mousedown",e=>{
  const rc=e.target.classList.contains("rsz-c"),rr=e.target.classList.contains("rsz-r");
  if(!rc&&!rr)return;
  e.preventDefault();e.stopPropagation();
  const sh=sheet(),c=+e.target.dataset.c,r=+e.target.dataset.r;
  const start=rc?e.clientX:e.clientY;
  const base=rc?(sh.colW[c]||DEFW):(sh.rowH[r]||22);
  const tip=$("sizetip");
  const mm=ev=>{
    const d=(rc?ev.clientX:ev.clientY)-start;
    let size;
    if(rc){size=sh.colW[c]=Math.max(30,base+d);table.tHead.rows[0].cells[c+1].style.width=size+"px";sizeTable();}
    else{size=sh.rowH[r]=Math.max(16,base+d);table.tBodies[0].rows[r].style.height=size+"px";}
    tip.textContent=size+" px";
    tip.style.display="block";
    tip.style.left=(ev.clientX+12)+"px";tip.style.top=(ev.clientY+12)+"px";
    paintSelection();
  };
  const mu=()=>{
    removeEventListener("mousemove",mm);removeEventListener("mouseup",mu);
    tip.style.display="none";save();
  };
  addEventListener("mousemove",mm);addEventListener("mouseup",mu);
});

/* ---------- events ---------- */
$("gridwrap").addEventListener("mousedown",e=>{
  const td=e.target.closest("td");
  if(e.target.classList.contains("rsz-c")||e.target.classList.contains("rsz-r"))return;
  if(!td)return;
  const rt=refTarget();
  if(rt){
    e.preventDefault(); // keep focus in the input: no blur, no commit
    const anchor={c:+td.dataset.c,r:+td.dataset.r};
    const set=b=>{
      if(rt.mode==="replace"){
        rt.el.value=rt.single?qualifiedRef(anchor,anchor):qualifiedRef(anchor,b);
        rt.el.focus();
        rt.el.dispatchEvent(new Event("input",{bubbles:true})); // let the rule/field react
        paintRefs();
      }
      else putRef(rt.el,rangeRef(anchor,b));
    };
    set(anchor);
    const fed=rt.el;
    const mm=ev=>{const t=ev.target.closest&&ev.target.closest("td");
      if(t)set({c:+t.dataset.c,r:+t.dataset.r});};
    const mu=()=>{removeEventListener("mousemove",mm);removeEventListener("mouseup",mu);};
    addEventListener("mousemove",mm);addEventListener("mouseup",mu);
    return;
  }
  if(editing)commitEdit(curEditor().value);
  const tc=+td.dataset.c,tr=+td.dataset.r,tcell=cell(sheet(),addr(tc,tr));
  const hasDv=!!(tcell&&tcell.f&&tcell.f.dv);
  // clicking the ▾ marker opens the list right away
  if(hasDv&&e.target.classList.contains("dvmark")){
    sel={c:tc,r:tr};selEnd=null;paintSelection();
    e.preventDefault();startEdit();
    return;
  }
  // a plain click on an already-selected dropdown cell opens it too, but only if it wasn't a drag
  const openOnUp=hasDv&&sel.c===tc&&sel.r===tr&&!selEnd;
  let moved=false;
  if(e.shiftKey){selEnd={c:tc,r:tr};paintSelection();return;} // extend from the anchor
  sel={c:tc,r:tr};selEnd=null;paintSelection();
  const mm=ev=>{const t=ev.target.closest("td");if(t){moved=moved||+t.dataset.c!==tc||+t.dataset.r!==tr;selEnd={c:+t.dataset.c,r:+t.dataset.r};paintSelection();}};
  const mu=()=>{removeEventListener("mousemove",mm);removeEventListener("mouseup",mu);
    if(openOnUp&&!moved)startEdit();};
  addEventListener("mousemove",mm);addEventListener("mouseup",mu);
});
$("gridwrap").addEventListener("dblclick",e=>{if(e.target.closest("td"))startEdit();});

/* ---------- fill handle ---------- */
// Dragging the handle repeats the selected block over the cells swept, shifting
// relative references the same way a paste does. The block tiles, so dragging two
// cells down four rows lays them down twice.
function fillRect(R,tc,tr){
  // extend along whichever axis the pointer left the block on; ties go to the rows,
  // because a downward fill is what the handle is reached for nearly every time
  const dDown=tr-R.r2,dUp=R.r1-tr,dRight=tc-R.c2,dLeft=R.c1-tc;
  const vert=Math.max(dDown,dUp),horz=Math.max(dRight,dLeft);
  if(vert<=0&&horz<=0)return null;
  if(vert>=horz)return{c1:R.c1,c2:R.c2,r1:Math.min(R.r1,tr),r2:Math.max(R.r2,tr)};
  return{c1:Math.min(R.c1,tc),c2:Math.max(R.c2,tc),r1:R.r1,r2:R.r2};
}
function paintFill(F,R){
  for(const td of table.querySelectorAll("td.filling"))td.classList.remove("filling");
  if(!F)return;
  for(let r=F.r1;r<=F.r2;r++)for(let c=F.c1;c<=F.c2;c++)
    if(r<R.r1||r>R.r2||c<R.c1||c>R.c2)tdAt(c,r).classList.add("filling");
}
function doFill(F,R){
  const sh=sheet(),w=R.c2-R.c1+1,h=R.r2-R.r1+1;
  const mod=(n,m)=>((n%m)+m)%m;
  for(let r=F.r1;r<=F.r2;r++)for(let c=F.c1;c<=F.c2;c++){
    if(r>=R.r1&&r<=R.r2&&c>=R.c1&&c<=R.c2)continue;   // the source block is left alone
    const sc=R.c1+mod(c-R.c1,w),sr=R.r1+mod(r-R.r1,h);
    writeCell(sh,c,r,cell(sh,addr(sc,sr)),c-sc,r-sr,"all");
  }
  paintAll();save();
}
function fillHandleDown(e){
  e.preventDefault();e.stopPropagation();
  if(editing)commitEdit(curEditor().value);
  const R=selRect();
  let F=null;
  const mm=ev=>{
    const t=document.elementFromPoint(ev.clientX,ev.clientY);
    const td=t&&t.closest&&t.closest("td");
    if(!td)return;
    F=fillRect(R,+td.dataset.c,+td.dataset.r);
    paintFill(F,R);
  };
  const mu=()=>{
    removeEventListener("mousemove",mm);removeEventListener("mouseup",mu);
    paintFill(null,R);
    if(!F)return;
    doFill(F,R);
    sel={c:F.c1,r:F.r1};selEnd={c:F.c2,r:F.r2};
    paintSelection();
  };
  addEventListener("mousemove",mm);addEventListener("mouseup",mu);
}

document.addEventListener("keydown",e=>{
  if(editing||e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.isContentEditable)return;
  if(e.key==="ArrowUp"){move(0,-1);e.preventDefault();}
  else if(e.key==="ArrowDown"||e.key==="Enter"){move(0,1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){move(-1,0);e.preventDefault();}
  else if(e.key==="ArrowRight"||e.key==="Tab"){move(1,0);e.preventDefault();}
  else if(e.key==="Delete"&&axisSel()){
    // a whole row/column selection means remove it; Backspace still just clears
    const A=axisSel();
    deleteAt(A.a,A.b-A.a+1,A.isCol);
    e.preventDefault();
  }
  else if(e.key==="Delete"||e.key==="Backspace"){
    const en=selEnd||sel,sh=sheet();
    for(let r=Math.min(sel.r,en.r);r<=Math.max(sel.r,en.r);r++)
      for(let c=Math.min(sel.c,en.c);c<=Math.max(sel.c,en.c);c++)delete sh.cells[addr(c,r)];
    paintAll();save();e.preventDefault();
  }
  else if(e.key==="Escape"){if(clip){clip=null;paintClip();}}
  else if(e.key==="F2"){startEdit();}
  else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){e.preventDefault();startEdit(e.key);}
});

$("finput").addEventListener("keydown",e=>{

    pick=null;paintAll();clearRefs();save();e.preventDefault();
    focusGrid(true);
    move(0,1);
  }
});

$("finput").addEventListener("click",()=>{pick=null;});
$("finput").addEventListener("focus",()=>{pick=null;paintRefs();});
$("finput").addEventListener("blur",()=>{pick=null;clearRefs();});
